openapi: 3.0.3
info:
  title: Analytics Service API
  version: 1.0.0
  description: |
    Usage Analytics service (`05-analytics-service`, internal port 3004, PostgreSQL db `analytics`, table `usage_event`).
    Records how the app is used and gives the administrator aggregated figures.

    **Based on:** Backend `2993301` (`origin/develop`, 2026-10-16), `services/analytics-service`. Every path below exists in
    the code; routes that were drafted but not built (`/sections`, `/sessions`, `/events/summary`) are listed in
    `07-api/README.md` ("Planned, not implemented").

    Public paths served through the gateway: `/api/analytics/**`. Port 3004 is internal: use the gateway at `http://localhost:8080`.

    ## Access rules
    - `POST /api/analytics/events`: any valid JWT. The user id always comes from the token. The JWT of an account already
      deleted answers `401 ACCOUNT_DELETED`.
    - `GET /summary`, `/top-signs`, `/daily`: JWT with the `ADMIN` role.
    - `GET /reports/sections`: JWT with the permission `stats.read`.

    ## Date ranges
    Every report needs `from` and `to` as real calendar dates `YYYY-MM-DD` (both inclusive, Colombia time) with `from <= to`.
    A missing, malformed or reversed range answers `400 VALIDATION_ERROR` ("from y to son obligatorios con formato YYYY-MM-DD").

    ## Response format
    Success: `{ "success": true, "data"?: any }`. Error: `{ "success": false, "code": string, "message": string }` (`ApiError` in `_shared.yaml`).

    ## Events consumed (RabbitMQ, exchange `traduce.events`, one queue per event)
    - `recognition.TranslationProduced` becomes a `TRANSLATION_COMPLETED` usage event with the sign codes of the gloss.
    - `iam.UserRegistered` becomes a `USER_REGISTERED` usage event.
    - `iam.UserDeleted` unlinks the user from their usage events (they stay as anonymous statistics) and records the id in
      `erased_users`, so later events of that account are refused.
    The service is idempotent by `eventId` (unique column). It publishes no events.

servers:
  - url: http://localhost:8080
    description: Local development through the api-gateway (the only port published by Docker Compose). The service itself listens on port 3004 inside the network.

security:
  - bearerAuth: []

tags:
  - name: Events
    description: Usage events sent by the client
  - name: Reports
    description: Aggregated figures for the administrator
  - name: Health
    description: Service status (internal)

paths:
  /health:
    servers:
      - url: http://localhost:3004
        description: Internal port of the service (not routed by the gateway; the gateway has its own `/health`)
    get:
      summary: Health check
      operationId: health
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'

  /api/analytics/events:
    post:
      summary: Record a usage event
      description: |
        The authenticated user records an event about themselves. `referenceType` and `referenceId` must be sent together.
        `USER_REGISTERED` is reserved for the `iam.UserRegistered` consumer and is rejected here, and so is `referenceType: USER`.
      operationId: recordEvent
      tags: [Events]
      x-requirements: [FR-701, FR-702, FR-951, FR-952, HU-USG-001, HU-NAV-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordEventRequest'
            example:
              section: TRANSLATION
              eventType: TRANSLATION_STARTED
      responses:
        '202':
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/analytics/summary:
    get:
      summary: Translations and new users in a range (ADMIN)
      operationId: getSummary
      tags: [Reports]
      x-requirements: [FR-702, FR-706]
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: Totals for the range
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UsageSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/analytics/top-signs:
    get:
      summary: Most translated signs in a range (ADMIN)
      operationId: getTopSigns
      tags: [Reports]
      x-requirements: [FR-702, FR-706]
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: limit
          in: query
          description: Number of signs (default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Signs ordered by number of translations
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TopSign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/analytics/daily:
    get:
      summary: Translations and new users per day (ADMIN)
      operationId: getDailySeries
      tags: [Reports]
      x-requirements: [FR-702, FR-706]
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: One entry per day that has any usage event in the range (days without events are absent)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DailyUsage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/analytics/reports/sections:
    get:
      summary: Visits per app section (permission stats.read)
      description: Counts `SECTION_VIEW` events per section in the range. `from` and `to` are required.
      operationId: getSectionReport
      tags: [Reports]
      x-requirements: [FR-703, FR-706, HU-USG-002]
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: Visits per section
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SectionReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    FromParam:
      name: from
      in: query
      required: true
      description: First day of the range, `YYYY-MM-DD` (inclusive)
      schema:
        type: string
        format: date
      example: '2026-10-01'
    ToParam:
      name: to
      in: query
      required: true
      description: Last day of the range, `YYYY-MM-DD` (inclusive); not before `from`
      schema:
        type: string
        format: date
      example: '2026-10-12'

  schemas:
    ServiceHealth:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: analytics-service

    UsageSection:
      type: string
      enum: [HOME, TRANSLATION, ALPHABET, LEXICON, HISTORY, PROFILE, SETTINGS, NOTIFICATIONS, ACHIEVEMENTS, ADMIN]

    ClientEventType:
      type: string
      description: Event types a client may send (`USER_REGISTERED` is internal)
      enum:
        - SECTION_VIEW
        - TRANSLATION_STARTED
        - TRANSLATION_COMPLETED
        - TRANSLATION_FAILED
        - AUDIO_PLAYED
        - SIGN_VIEWED
        - SEARCH_PERFORMED
        - HISTORY_ENTRY_DELETED
        - PREFERENCE_CHANGED
        - NOTIFICATION_OPENED

    ReferenceType:
      type: string
      enum: [TRANSLATION, SIGN, CATEGORY, ACHIEVEMENT, NOTIFICATION, AI_MODEL, USER]

    RecordEventRequest:
      type: object
      required: [section, eventType]
      properties:
        section:
          $ref: '#/components/schemas/UsageSection'
        eventType:
          $ref: '#/components/schemas/ClientEventType'
        sessionId:
          type: string
          format: uuid
          description: Optional client session id
        referenceType:
          $ref: '#/components/schemas/ReferenceType'
        referenceId:
          type: string
          format: uuid
          description: Required if `referenceType` is sent, and only then

    UsageSummary:
      type: object
      required: [translations, newUsers]
      properties:
        translations:
          type: integer
        newUsers:
          type: integer

    TopSign:
      type: object
      required: [signCode, translations]
      properties:
        signCode:
          type: string
        translations:
          type: integer

    DailyUsage:
      type: object
      required: [date, translations, newUsers]
      properties:
        date:
          type: string
          format: date
        translations:
          type: integer
        newUsers:
          type: integer

    SectionReport:
      type: object
      required: [from, to, sections]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        sections:
          type: array
          items:
            type: object
            required: [section, visits]
            properties:
              section:
                type: string
              visits:
                type: integer

  responses:
    BadRequest:
      description: Invalid body or date range (`VALIDATION_ERROR`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid token (`UNAUTHORIZED`), or token of a deleted account on `POST /events` (`ACCOUNT_DELETED`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
    Forbidden:
      description: The token lacks the `ADMIN` role or the permission `stats.read` (`FORBIDDEN`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
