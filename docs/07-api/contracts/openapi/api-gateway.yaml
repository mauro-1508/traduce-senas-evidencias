openapi: 3.0.3
info:
  title: API Gateway
  version: 1.0.0
  description: |
    Single entry point of Traduce Señas (`01-api-gateway`, port 8080, the only port Docker Compose publishes to the host).
    The gateway owns no data and no business logic: it applies CORS and rate limits, checks the JWT when one is sent, and forwards
    each request to the service that owns the path prefix. Clients only talk to the gateway; the paths below `/api` are the ones
    documented in each service contract.

    **Based on:** Backend `2993301` (`origin/develop`, 2026-10-16), `services/api-gateway` (`src/route_table.ts`, `src/app.ts`, `src/health.ts`,
    `src/optional_auth.ts`, `src/cors_options.ts`, `src/proxies.ts`).

    ## Routing table
    | Public path prefix | Upstream service | Internal port | Contract |
    |--------------------|------------------|---------------|----------|
    | `/api/auth/**`, `/api/users/**`, `/api/iam/**` | iam-service | 3001 | `iam-service.yaml` |
    | `/api/translations/**`, `/api/recognition/**`, `/api/sign-templates/**` (deprecated alias), `/api/samples/**` | recognition-service | 3002 | `recognition-service.yaml` |
    | `/api/lexicon/**` (including `/api/lexicon/media/**`) | lexicon-service | 3003 | `lexicon-service.yaml` |
    | `/api/analytics/**` | analytics-service | 3004 | `analytics-service.yaml` |
    | `/api/profile/**`, `/api/notifications/**`, `/api/achievements/**` | profile-service | 3005 | `profile-service.yaml` |

    Paths are forwarded unchanged (no prefix stripping) and the body is not parsed. A path outside these prefixes answers `404 NOT_FOUND`.
    The same table is machine-readable in the `x-routing` extension of this file.

    ## Authentication
    Protected endpoints need a JWT issued by iam-service (`POST /api/auth/login`, HS256):
    ```
    Authorization: Bearer <token>
    ```
    The gateway verifies the token **only if the header is present** (outside `/api/auth`): an invalid or expired token is rejected with
    `401 UNAUTHORIZED` before reaching the service. A request without a header is let through; every service decides which routes
    need a session and enforces roles and permissions. The gateway adds no identity headers: services read the claims from the token.

    ## Rate limits
    300 requests per minute per client for everything (`RATE_LIMIT_MAX`, `RATE_LIMIT_WINDOW_MS`), and 10 per minute for
    `POST /api/auth/login`, `/forgot-password`, `/verify-code`, `/reset-password`, `/google` and `/facebook` (`AUTH_RATE_LIMIT_MAX`).
    Over the limit: `429 RATE_LIMITED`. Limits count per client IP; behind a reverse proxy set `TRUST_PROXY` to the number of
    trusted proxies (`1` in production behind Caddy) so the gateway reads the client IP from `X-Forwarded-For`. With `0`
    (default) the header is ignored.

    ## CORS
    Allowed origins come from `CORS_ORIGINS` (comma separated). If it is empty, development allows `http://localhost:8081` and
    `http://localhost:19006` (Expo web) and production allows none. Native apps send no `Origin` and do not depend on CORS.

    ## Errors
    All gateway errors use `{ "success": false, "code": string, "message": string }` (`ApiError` in `_shared.yaml`):
    `401 UNAUTHORIZED` invalid token, `404 NOT_FOUND` unknown route, `429 RATE_LIMITED`, `502 BAD_GATEWAY` the upstream service does not answer.

    ## Pending (in progress by the backend team)
    The backend team is adding a session version to the token (`401 SESSION_REVOKED`, `503 AUTH_UNAVAILABLE` at the gateway). It is not in Backend `2993301`, so it is not documented as behaviour.

servers:
  - url: https://traducesenas.tech
    description: Production (Caddy with HTTPS in front of the gateway)
  - url: http://localhost:8080
    description: Local development (Docker Compose or `npm run dev:all`)

x-routing:
  - prefixes: [/api/auth, /api/users, /api/iam]
    upstream: iam-service
    target: http://iam-service:3001
    contract: iam-service.yaml
  - prefixes: [/api/translations, /api/recognition, /api/sign-templates, /api/samples]
    upstream: recognition-service
    target: http://recognition-service:3002
    contract: recognition-service.yaml
  - prefixes: [/api/lexicon]
    upstream: lexicon-service
    target: http://lexicon-service:3003
    contract: lexicon-service.yaml
  - prefixes: [/api/analytics]
    upstream: analytics-service
    target: http://analytics-service:3004
    contract: analytics-service.yaml
  - prefixes: [/api/profile, /api/notifications, /api/achievements]
    upstream: profile-service
    target: http://profile-service:3005
    contract: profile-service.yaml

tags:
  - name: Health
    description: Status of the gateway and its upstreams

paths:
  /health:
    get:
      summary: Gateway health check
      description: |
        Calls `GET /health` of each service with a 2 second timeout (`HEALTH_TIMEOUT_MS`) and reports the result,
        together with the deployed backend version.
        It always answers 200 while the gateway is alive; read the body to know if a service is down.
        No authentication required.
      operationId: health
      tags: [Health]
      security: []
      responses:
        '200':
          description: Gateway running (services may be down)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
              examples:
                allUp:
                  summary: All services up
                  value:
                    status: ok
                    version: 1.0.0
                    services:
                      iam: { status: up }
                      recognition: { status: up }
                      lexicon: { status: up }
                      analytics: { status: up }
                      profile: { status: up }
                degraded:
                  summary: One service down
                  value:
                    status: degraded
                    version: 1.0.0
                    services:
                      iam: { status: up }
                      recognition: { status: up }
                      lexicon: { status: down }
                      analytics: { status: up }
                      profile: { status: up }
        '429':
          description: Rate limit exceeded (`RATE_LIMITED`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'

components:
  schemas:
    ServiceStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
    HealthReport:
      type: object
      required: [status, version, services]
      properties:
        status:
          type: string
          description: '`ok` only if every service is up'
          enum: [ok, degraded]
        version:
          type: string
          description: Backend version (SemVer) from the root `package.json` of the Backend repo; `unknown` if it cannot be read
          example: 1.0.0
        services:
          type: object
          required: [iam, recognition, lexicon, analytics, profile]
          properties:
            iam:
              $ref: '#/components/schemas/ServiceStatus'
            recognition:
              $ref: '#/components/schemas/ServiceStatus'
            lexicon:
              $ref: '#/components/schemas/ServiceStatus'
            analytics:
              $ref: '#/components/schemas/ServiceStatus'
            profile:
              $ref: '#/components/schemas/ServiceStatus'
