openapi: 3.0.3
info:
  title: API Gateway
  version: 1.0.0
  description: |
    Single entry point of Traduce Senas (`01-api-gateway`, port 8080). The gateway owns no data and no
    business logic: it routes, validates the JWT signature, applies rate limiting and CORS, and forwards
    each request to the domain service that owns the path. Clients only talk to the gateway; the
    paths below `/api` are the same ones documented in each service contract.

    ## Routing table
    | Public path prefix | Upstream service | Port | Contract |
    |--------------------|------------------|------|----------|
    | `/api/auth/**`, `/api/users/**`, `/api/roles/**`, `/api/consents/**` | iam-service | 3001 | `iam-service.yaml` |
    | `/api/translations/**`, `/api/recognition/**`, `/api/models/**`, `/api/samples/**` | recognition-service | 3002 | `recognition-service.yaml` |
    | `/api/lexicon/**` (including `/api/lexicon/media/**`) | lexicon-service | 3003 | `lexicon-service.yaml` |
    | `/api/analytics/**` | analytics-service | 3004 | `analytics-service.yaml` |
    | `/api/profile/**`, `/api/notifications/**`, `/api/achievements/**` | profile-service | 3005 | `profile-service.yaml` |

    Paths are forwarded unchanged (no prefix stripping). Routing is also declared machine-readably in
    the `x-routing` extension of this file.

    ## Authentication
    Protected endpoints require a JWT issued by iam-service:
    ```
    Authorization: Bearer <accessToken>
    ```
    Get it with `POST /api/auth/login`. The gateway validates the signature (public keys from
    `GET /api/auth/jwks`) and rejects invalid tokens with `401` before reaching the service. Public
    endpoints (registration, login, lexicon catalog, media) are let through without a token. Services
    still enforce authorization (for example the ADMIN role).

    ## Headers added by the gateway (internal)
    - `X-User-Id`: user UUID (`sub` claim)
    - `X-User-Roles`: roles of the user, comma separated (for example `ADMIN`)
    - `X-Correlation-Id`: id to correlate logs across services

    ## Communication between services
    Client calls are synchronous REST through this gateway. Services talk to each other
    asynchronously with domain events over RabbitMQ (topic exchange `traduce.events`, routing key
    `<service>.<event>`); the gateway is not involved.

    ## Errors
    Gateway errors use `ErrorResponse` from `_shared.yaml`: `401` invalid token, `404` unknown route,
    `429` rate limit exceeded, `502`/`503` upstream unavailable.

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.dev.{domain}
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}
    description: Production
    variables:
      domain:
        default: example.com

x-routing:
  - prefixes: [/api/auth, /api/users, /api/roles, /api/consents]
    upstream: iam-service
    target: http://iam-service:3001
    contract: iam-service.yaml
  - prefixes: [/api/translations, /api/recognition, /api/models, /api/samples]
    upstream: recognition-service
    target: http://recognition-service:3002
    contract: recognition-service.yaml
  - prefixes: [/api/lexicon]
    upstream: lexicon-service
    target: http://lexicon-service:3003
    contract: lexicon-service.yaml
  - prefixes: [/api/analytics]
    upstream: analytics-service
    target: http://analytics-service:3004
    contract: analytics-service.yaml
  - prefixes: [/api/profile, /api/notifications, /api/achievements]
    upstream: profile-service
    target: http://profile-service:3005
    contract: profile-service.yaml

tags:
  - name: Health
    description: Status of the gateway and its upstreams

paths:
  /health:
    get:
      summary: Gateway health check
      description: |
        Verifies that the gateway is running and reports the state of every upstream service.
        No authentication required.
      operationId: health
      tags: [Health]
      security: []
      responses:
        '200':
          description: Gateway healthy (upstreams may be degraded)
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  timestamp:
                    $ref: './_shared.yaml#/components/schemas/Timestamp'
                  upstreams:
                    type: object
                    description: State of each domain service
                    additionalProperties:
                      type: string
                      enum: [ok, degraded, down]
              example:
                status: ok
                timestamp: '2026-10-04T10:30:00Z'
                upstreams:
                  iam-service: ok
                  recognition-service: ok
                  lexicon-service: ok
                  analytics-service: ok
                  profile-service: ok
        '503':
          description: Gateway starting or a critical upstream is down
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
