openapi: 3.0.3
info:
  title: IAM Service API
  version: 1.0.0
  description: |
    Identity & Access service (`02-iam-service`, internal port 3001, PostgreSQL db `iam`).
    Accounts, email verification, login, password reset, account self-service and roles / permissions (RBAC).

    **Based on:** Backend `2993301` (`origin/develop`, 2026-10-16), `services/iam-service`. Every path below exists in
    the code; routes that are only planned are listed in `07-api/README.md` ("Planned, not implemented").

    Public paths served through the gateway: `/api/auth/**`, `/api/users/**`, `/api/iam/**`.
    Port 3001 is internal: Docker Compose does not publish it; use the gateway at `http://localhost:8080`.

    ## Authentication flow
    1. `POST /api/auth/register` creates the account with status `INACTIVE`, assigns the `USER` role,
       publishes `iam.UserRegistered` and emails a 6-digit code (valid 15 minutes, 5 attempts).
    2. `POST /api/auth/verify-email` (email + code + password) activates the account. It does not log in.
    3. `POST /api/auth/login` returns one JWT (`data.token`, HS256, 1 day by default). There is no refresh token.
    4. Send `Authorization: Bearer <token>` on protected calls. The token carries `sub`, `email`, `roles`
       and `permissions`; the roles are fixed when the token is signed.
    5. Password recovery: `forgot-password` (code by email), optional `verify-code`, then `reset-password`.
    6. Social login: `POST /api/auth/google` (Google ID token) or `POST /api/auth/facebook` (Facebook access token).
       The service verifies the token with the provider and logs in, or creates the account as `ACTIVE`
       without a password when the email is new. The answer has the same shape as `login`.

    Roles in the seed: `USER`, `LINGUIST`, `ADMIN`. Role administration needs the permission `users.manage`.

    ## Response format
    Success: `{ "success": true, "message"?: string, "data"?: object }`.
    Error: `{ "success": false, "code": string, "message": string }` (`ApiError` in `_shared.yaml`).
    Business errors use the codes documented per operation. Unexpected errors return `500 INTERNAL_ERROR`.
    Sensitive paths (`register`, `verify-email`, `resend-verification`, `login`, `forgot-password`, `verify-code`,
    `reset-password`, `google`, `facebook`) are limited by the gateway to 10 requests per minute per client by default,
    shared among them (`AUTH_RATE_LIMIT_MAX`, `429 RATE_LIMITED`).

    ## Events published (RabbitMQ, exchange `traduce.events`)
    - `iam.UserRegistered` `{ userId, email, name }`.
    - `iam.UserDeleted` `{ userId, occurredAt }`, written to the `outbox_events` table in the same transaction that
      erases the account and published by the outbox relay. profile-service, recognition-service and
      analytics-service erase or unlink their own data when they receive it.

    The service consumes no events.

servers:
  - url: http://localhost:8080
    description: Local development through the api-gateway (the only port published by Docker Compose). The service itself listens on port 3001 inside the network.

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Registration, email verification, login and password recovery
  - name: Users
    description: Account of the authenticated user
  - name: IAM
    description: Roles, permissions and role assignment
  - name: Health
    description: Service status (internal)

paths:
  /health:
    servers:
      - url: http://localhost:3001
        description: Internal port of the service (not routed by the gateway; the gateway has its own `/health`)
    get:
      summary: Health check
      operationId: health
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'

  # ───────────────────────────── Auth ─────────────────────────────
  /api/auth/register:
    post:
      summary: Register a new user
      description: |
        Creates the account as `INACTIVE` with the `USER` role and tries to email a verification code.
        Requires express consent (`acceptedTerms: true`) and the accepted `termsVersion`; without them the answer is `400 INVALID_BODY` and no account is created.
        The password needs at least 8 characters and 3 of these 4 kinds: uppercase, lowercase, digit and symbol (the same minimum as the app); otherwise `400 VALIDATION_ERROR`.
        If the email cannot be sent the account is kept and `verification_email_sent` is `false`; ask for a new code with `resend-verification`.
      operationId: register
      tags: [Auth]
      security: []
      x-requirements: [FR-001, FR-002, HU-IAM-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Maria Garcia
              email: maria@example.com
              password: <your-password>
              acceptedTerms: true
              termsVersion: '2025-01'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The email already has an account (`EMAIL_ALREADY_EXISTS`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/login:
    post:
      summary: Log in
      description: |
        Returns the JWT. Wrong email or password gives the same `INVALID_CREDENTIALS` answer. Only after the
        password is correct the account state is revealed: `ACCOUNT_BLOCKED` or `EMAIL_NOT_VERIFIED`.
      operationId: login
      tags: [Auth]
      security: []
      x-requirements: [FR-005, FR-006, FR-007, HU-IAM-003, HU-IAM-004]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: maria@example.com
              password: <your-password>
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'
        '403':
          description: Email not verified (`EMAIL_NOT_VERIFIED`) or account blocked (`ACCOUNT_BLOCKED`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/verify-email:
    post:
      summary: Verify the email and activate the account
      description: |
        Needs the 6-digit code **and** the account password, so that whoever did not create the account cannot activate it.
        Any failure (unknown email, account not `INACTIVE`, wrong or expired code, too many attempts, wrong password) gives the same `INVALID_CODE`.
      operationId: verifyEmail
      tags: [Auth]
      security: []
      x-requirements: [FR-003, FR-004, HU-IAM-002]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/resend-verification:
    post:
      summary: Ask for a new verification code
      description: |
        Always answers 200 with the same message, whether or not the account exists or is pending. The code is sent in the background.
        At most one code per 60 seconds and 5 per hour per account.
      operationId: resendVerification
      tags: [Auth]
      security: []
      x-requirements: [FR-003, HU-IAM-002]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/forgot-password:
    post:
      summary: Request a password reset code
      description: |
        Always answers 200 with the same message. If the account exists and is not blocked, a 6-digit code (valid 15 minutes)
        is emailed in the background, subject to the same 60 s / 5 per hour limits.
      operationId: forgotPassword
      tags: [Auth]
      security: []
      x-requirements: [FR-010, HU-IAM-006]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/verify-code:
    post:
      summary: Check a password reset code
      description: Validates the code without consuming it. A wrong code spends one of the 5 attempts of the current code.
      operationId: verifyCode
      tags: [Auth]
      security: []
      x-requirements: [FR-010, HU-IAM-006]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/reset-password:
    post:
      summary: Set a new password with the reset code
      description: Consumes the code. `newPassword` needs at least 8 characters and at most 72 bytes.
      operationId: resetPassword
      tags: [Auth]
      security: []
      x-requirements: [FR-010, HU-IAM-006]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/google:
    post:
      summary: Log in with Google
      description: |
        Verifies the Google ID token (audience in `GOOGLE_CLIENT_IDS`) and requires a verified email.
        An existing account logs in; a new email creates an `ACTIVE` account without a password (role `USER`,
        publishes `iam.UserRegistered`). A `BLOCKED` account gets `ACCOUNT_BLOCKED`; an account that never
        verified its email gets `EMAIL_NOT_VERIFIED`.
      operationId: googleLogin
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Logged in, or account created and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid token or unverified Google email (`INVALID_GOOGLE_TOKEN`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'
        '403':
          description: Email not verified (`EMAIL_NOT_VERIFIED`) or account blocked (`ACCOUNT_BLOCKED`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Google login is not configured on the server (`GOOGLE_NOT_CONFIGURED`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'

  /api/auth/facebook:
    post:
      summary: Log in with Facebook
      description: |
        Verifies the Facebook access token with `FACEBOOK_APP_ID` and `FACEBOOK_APP_SECRET`. Same account rules
        as `POST /api/auth/google`. The Facebook account must share an email (`FACEBOOK_EMAIL_REQUIRED`).
      operationId: facebookLogin
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacebookLoginRequest'
      responses:
        '200':
          description: Logged in, or account created and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid body (`VALIDATION_ERROR`) or the Facebook account shares no email (`FACEBOOK_EMAIL_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'
        '401':
          description: Invalid token (`INVALID_FACEBOOK_TOKEN`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'
        '403':
          description: Email not verified (`EMAIL_NOT_VERIFIED`) or account blocked (`ACCOUNT_BLOCKED`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Facebook login is not configured on the server (`FACEBOOK_NOT_CONFIGURED`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'

  # ───────────────────────────── Users ─────────────────────────────
  /api/users/stats:
    get:
      summary: User counters (administrator)
      description: Needs the permission `stats.read`.
      operationId: getUserStats
      tags: [Users]
      responses:
        '200':
          description: Counters
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permission (`PERMISSION_ERROR`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'

  /api/users/admins:
    get:
      summary: Ids of the active administrators (service to service)
      description: |
        Needs the permission `admins.read`, which no role grants: only the short-lived service token that
        profile-service signs carries it. profile-service uses the list to send the administrator reports
        by email to every administrator with notifications turned on (ADR-007).
      operationId: listAdminIds
      tags: [Users]
      responses:
        '200':
          description: Ids of the users with the `ADMIN` role and status `ACTIVE`
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [userIds]
                    properties:
                      userIds:
                        type: array
                        items:
                          type: integer
                          minimum: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permission (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'

  /api/users/me:
    get:
      summary: Get my account
      operationId: getMe
      tags: [Users]
      x-requirements: [FR-201]
      responses:
        '200':
          description: Basic data of the authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/MeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete my account
      description: |
        Erases the account permanently. An account with a password confirms with `password`; an account without
        a password (created with Google or Facebook) confirms with the 6-digit `code` sent by
        `POST /api/users/me/delete-code`. The only administrator cannot delete the account (`LAST_ADMIN`).

        The account, its roles and its codes are erased in one transaction that also writes `iam.UserDeleted`
        to the outbox; the other services erase or unlink their data when the event arrives. A JWT issued before
        the deletion is rejected by those services with `401 ACCOUNT_DELETED`.
      operationId: deleteMe
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          description: Invalid body (`VALIDATION_ERROR`) or wrong or expired deletion code (`INVALID_CODE`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wrong password (`INVALID_PASSWORD`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The account belongs to the last administrator (`LAST_ADMIN`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'

  /api/users/me/delete-code:
    post:
      summary: Send me a code to delete my account
      description: |
        Only for accounts without a password (created with Google or Facebook). Emails a 6-digit code to confirm
        `DELETE /api/users/me`. One code per minute and a limited number per hour.
      operationId: sendDeletionCode
      tags: [Users]
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The account has a password and must confirm with it (`HAS_PASSWORD`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'
        '429':
          description: Asked too soon (`CODE_COOLDOWN`) or too many codes in the last hour (`CODE_LIMIT`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'

  /api/users/me/password:
    post:
      summary: Change my password
      description: |
        The new password needs 8 to 72 bytes, an upper-case letter, a lower-case letter, a number and a symbol, and must differ from the current one.
        Accounts without a password (social login) get `INVALID_PASSWORD`.
      operationId: changeMyPassword
      tags: [Users]
      x-requirements: [FR-202, FR-905, HU-PROF-002]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wrong current password (`INVALID_PASSWORD`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── IAM (RBAC) ─────────────────────────────
  /api/iam/me/access:
    get:
      summary: My roles and permissions
      description: Reads the current assignment from the database (the token keeps the values it was signed with).
      operationId: getMyAccess
      tags: [IAM]
      responses:
        '200':
          description: Roles and effective permissions
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Access'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/iam/roles:
    get:
      summary: List roles with their permissions
      description: Needs the permission `users.manage`.
      operationId: listRoles
      tags: [IAM]
      x-requirements: [FR-101, FR-102, HU-AUTHZ-001]
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /api/iam/users/{userId}/roles:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'
    post:
      summary: Assign a role to a user
      description: Needs the permission `users.manage`. Assigning a role the user already has is accepted.
      operationId: assignRole
      tags: [IAM]
      x-requirements: [FR-101, HU-AUTHZ-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
            example:
              roleName: LINGUIST
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/iam/users/{userId}/roles/{roleName}:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'
      - name: roleName
        in: path
        required: true
        schema:
          type: string
          maxLength: 50
        example: LINGUIST
    delete:
      summary: Revoke a role from a user
      description: |
        Needs the permission `users.manage`. The last `ADMIN` cannot lose the role (`LAST_ADMIN`) and every user keeps at least one role (`ROLE_REQUIRED`).
        The user's existing tokens keep the old roles until they expire.
      operationId: revokeRole
      tags: [IAM]
      x-requirements: [FR-101, HU-AUTHZ-001]
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Last administrator (`LAST_ADMIN`) or last role of the user (`ROLE_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'

  /api/iam/roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    delete:
      summary: Delete a role
      description: Needs the permission `users.manage`. The seed roles are protected (`ROLE_PROTECTED`) and a role assigned to users cannot be deleted (`ROLE_IN_USE`).
      operationId: deleteRole
      tags: [IAM]
      x-requirements: [FR-103, HU-AUTHZ-002]
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Role in use (`ROLE_IN_USE`) or protected (`ROLE_PROTECTED`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    UserIdParam:
      name: userId
      in: path
      required: true
      description: Numeric user id issued by this service
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647

  schemas:
    ServiceHealth:
      type: object
      description: |
        Always HTTP 200 while the process is alive (the Docker `HEALTHCHECK` only checks that). `degraded` means the
        service answers but leaves data unprocessed; `issues` and `details` are only present then.
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: iam-service
        issues:
          type: array
          description: '`outbox_backlog` (an event such as `iam.UserDeleted` has waited more than 10 minutes in `outbox_events`) or `outbox_unavailable` (the check failed or took longer than 1.5 s)'
          items:
            type: string
          example: [outbox_backlog]
        details:
          type: object
          description: Detail per check, for the internal network only; the gateway does not publish it
          additionalProperties: true
          example: { outbox: { pending: 3, oldestPendingSeconds: 840 } }

    Message:
      type: object
      description: Success response that only carries a message
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          example: Operación realizada

    RegisterRequest:
      type: object
      required: [name, email, password, acceptedTerms, termsVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
          description: Trimmed and lower-cased by the server
        password:
          type: string
          minLength: 8
          description: |
            At least 8 characters and 3 of 4 kinds (uppercase, lowercase, digit, symbol); at most 72 bytes (bcrypt limit),
            longer values are rejected, not truncated
        acceptedTerms:
          type: boolean
          enum: [true]
          description: Express consent to the terms and the personal data policy (Ley 1581 de 2012). Any other value gives `400 INVALID_BODY`.
        termsVersion:
          type: string
          minLength: 1
          maxLength: 20
          description: Version of the terms the person accepted, stored in `users.terms_version`
          example: '2025-01'

    RegisterResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: Usuario registrado correctamente
        data:
          type: object
          required: [user_id, name, email, status, verification_email_sent]
          properties:
            user_id:
              type: integer
            name:
              type: string
            email:
              type: string
              format: email
            status:
              type: string
              enum: [INACTIVE]
            verification_email_sent:
              type: boolean

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: Inicio de sesión exitoso
        data:
          type: object
          required: [token, user]
          properties:
            token:
              type: string
              description: JWT (HS256, issuer `traduce-iam`, audience `traduce-api`; claims `sub`, `email`, `roles`, `permissions`)
            user:
              $ref: '#/components/schemas/UserSummary'

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    VerifyCodeRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'

    VerifyEmailRequest:
      type: object
      required: [email, code, password]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
        password:
          type: string
          description: Password of the account being verified

    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
        newPassword:
          type: string
          minLength: 8

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          maxLength: 256

    DeleteAccountRequest:
      type: object
      description: Send `password` for accounts with a password, or `code` for accounts without one.
      minProperties: 1
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
        code:
          type: string
          pattern: '^\d{6}$'
          description: Code sent by `POST /api/users/me/delete-code`

    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          minLength: 1
          maxLength: 8192
          description: Google ID token obtained by the client

    FacebookLoginRequest:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          minLength: 1
          maxLength: 2048
          description: Facebook access token obtained by the client

    AssignRoleRequest:
      type: object
      required: [roleName]
      properties:
        roleName:
          type: string
          minLength: 1
          maxLength: 50
          example: LINGUIST

    UserSummary:
      type: object
      required: [user_id, name, email]
      properties:
        user_id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email

    MeSummary:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [has_password]
          properties:
            has_password:
              type: boolean
              description: false for accounts created with Google or Facebook; the hash is never returned

    UserStats:
      type: object
      required: [totalUsers, activeAccounts]
      properties:
        totalUsers:
          type: integer
        activeAccounts:
          type: integer
          description: Accounts with status `ACTIVE`

    Access:
      type: object
      required: [roles, permissions]
      properties:
        roles:
          type: array
          items:
            type: string
          example: [USER]
        permissions:
          type: array
          items:
            type: string
          example: [translation.create, lexicon.read]

    Role:
      type: object
      required: [roleId, name, permissions]
      properties:
        roleId:
          type: integer
        name:
          type: string
          example: ADMIN
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string

  responses:
    Message:
      description: Operation done; the body carries a message
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    BadRequest:
      description: Invalid body or business rule (`INVALID_BODY`, `VALIDATION_ERROR`, `INVALID_CODE`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid token (`UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
    PermissionDenied:
      description: The token does not grant the permission (`PERMISSION_ERROR`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
    NotFound:
      description: User or role not found (`NOT_FOUND`, `USER_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
    TooManyRequests:
      description: Rate limit of the gateway exceeded (`RATE_LIMITED`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
