openapi: 3.0.3
info:
  title: Profile Service API
  version: 1.0.0
  description: |
    Profile service (`06-profile-service`, internal port 3005, PostgreSQL db `profile`). It keeps a copy of the account data
    (created from the `iam.UserRegistered` event), the interface preferences, in-app notifications and achievements.

    **Based on:** Backend `2993301` (`origin/develop`, 2026-10-16), `services/profile-service`. Every path below exists in
    the code; routes that were drafted but not built (devices, notification types, creating notifications or achievements,
    `PATCH /achievements/{id}`) are listed in `07-api/README.md` ("Planned, not implemented").

    Public paths served through the gateway: `/api/profile/**`, `/api/notifications/**`, `/api/achievements/**`.
    Port 3005 is internal: use the gateway at `http://localhost:8080`.

    ## Access rules
    Every route needs a valid JWT. Each user only sees their own data; the user id comes from the token.
    Sending `notificationsEnabled` in a `PATCH` (even `false` or an invalid value) needs the permission `notifications.manage`;
    without it the request answers `403 FORBIDDEN` and nothing is written. Theme and language need no permission.

    ## Missing and deleted accounts
    - If the account has no profile (its `iam.UserRegistered` was lost or the account is older than this service), a `PATCH` of
      preferences creates the profile with the email of the token and default preferences, then applies the change.
      `GET /api/profile/me` still answers `404` until that happens.
    - After `iam.UserDeleted` the profile is erased and the user id is kept in `erased_users`: a later `PATCH` answers
      `410 ACCOUNT_DELETED` and the profile is never recreated, not even by a late `iam.UserRegistered`.

    ## Response format
    Unlike the other services, successful responses are **not** wrapped in `{ success, data }`:
    - profile, preferences and a notification are returned as the object itself;
    - achievements are returned as `{ "data": [...] }`;
    - notifications are returned as `{ "data": [...], "meta": {...}, "unreadCount": n }`.
    Errors: `{ "success": false, "code": string, "message": string }` (`ApiError` in `_shared.yaml`).

    ## Events
    Consumes `iam.UserRegistered` (creates profile and default preferences), `iam.UserDeleted` (erases profile, preferences,
    notifications and achievement progress) and `recognition.TranslationProduced` (advances the achievements
    whose metric is `TRANSLATIONS_COMPLETED` and, if the user has notifications enabled, creates an in-app notification when one is unlocked).
    Publishes `profile.PreferencesChanged` and `profile.AchievementUnlocked`. Consumers are idempotent by `eventId` (table `processed_events`).

    ## Seed data
    The migration creates the notification type `ACHIEVEMENT_UNLOCKED` and three achievements: `FIRST_TRANSLATION` (1), `TEN_TRANSLATIONS` (10) and `FIFTY_TRANSLATIONS` (50).
    Gamification is provisional (RF8 is not approved).

servers:
  - url: http://localhost:8080
    description: Local development through the api-gateway (the only port published by Docker Compose). The service itself listens on port 3005 inside the network.

security:
  - bearerAuth: []

tags:
  - name: Profile
    description: Profile and interface preferences
  - name: Notifications
    description: In-app notifications
  - name: Achievements
    description: Achievements and progress
  - name: Challenges
    description: Daily challenges and their rewards
  - name: Health
    description: Service status (internal)

paths:
  /health:
    servers:
      - url: http://localhost:3005
        description: Internal port of the service (not routed by the gateway; the gateway has its own `/health`)
    get:
      summary: Health check
      operationId: health
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'

  # ───────────────────────────── Profile ─────────────────────────────
  /api/profile/me:
    get:
      summary: Get my profile
      description: Account data copied from iam plus the preferences. `404` if the `UserRegistered` event has not been processed yet.
      operationId: getProfile
      tags: [Profile]
      x-requirements: [FR-201, HU-PROF-001]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update my preferences and get the full profile
      description: |
        Accepts the same body as `PATCH /api/profile/preferences` (name, email and username cannot be changed here) and returns the whole profile.
        Same rules for `notificationsEnabled` and for missing or deleted accounts (see the description of this contract).
      operationId: updateProfile
      tags: [Profile]
      x-requirements: [FR-201, FR-901, HU-PROF-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesPatch'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/AccountDeleted'

  /api/profile/preferences:
    get:
      summary: Get my preferences
      description: Returns the defaults (`ES`, `LIGHT`, notifications on) if the user has no stored preferences.
      operationId: getPreferences
      tags: [Profile]
      x-requirements: [FR-203, FR-204, FR-205, FR-206, HU-PROF-003]
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: Update my preferences
      description: |
        Partial update; at least one field is required. Publishes `profile.PreferencesChanged` after the change is saved.
        Creates the profile if the account has none; answers `410 ACCOUNT_DELETED` if the account was deleted.
      operationId: updatePreferences
      tags: [Profile]
      x-requirements: [FR-203, FR-204, FR-205, FR-508, HU-PROF-003, HU-PROF-004, HU-PROF-005]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesPatch'
            example:
              theme: DARK
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/AccountDeleted'

  # ───────────────────────────── Notifications ─────────────────────────────
  /api/notifications:
    get:
      summary: List my notifications
      description: Newest first. `unreadCount` counts all unread notifications of the user, not only the page.
      operationId: listNotifications
      tags: [Notifications]
      x-requirements: [FR-502, FR-507, HU-NOTIF-002]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Page size (default 20, maximum 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: unreadOnly
          in: query
          description: Only `true` (the exact text) filters unread notifications
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/{id}/read:
    patch:
      summary: Mark a notification as read
      description: A notification that does not exist, is not a UUID or belongs to another user answers `404`.
      operationId: markNotificationRead
      tags: [Notifications]
      x-requirements: [FR-502, HU-NOTIF-002]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The notification, now read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Achievements ─────────────────────────────
  /api/achievements:
    get:
      summary: List achievements with my progress
      description: Secret achievements that are not unlocked show `???` as name and description.
      operationId: listAchievements
      tags: [Achievements]
      x-requirements: [FR-805, HU-GAM-004]
      responses:
        '200':
          description: Achievements
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AchievementProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/achievements/activity:
    post:
      summary: Record functional activity (letters viewed, active time, voice playback)
      description: |
        Feeds the achievements whose metric is measured from real use. The user id comes from the token; users with
        `users.manage` get `403`. `sessionId` identifies the browser session (16 to 80 characters: letters, digits and `-`).
        Kinds: `letter` (needs `code`, a letter of the alphabet), `tick` (active time, counted only in a continuous window
        after a confirmed translation), `pause`, `voice-start` (needs `translationId` of a translation of the user; answers a
        `playbackId`), `voice-end` and `voice-cancel` (need that `playbackId`). Invalid kinds, letters or unknown
        translations answer `400`. Publishes `profile.AchievementUnlocked` for each achievement unlocked.
      operationId: recordActivity
      tags: [Achievements]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
            example:
              sessionId: 3f2b8c1e-5d4a-4b7e-9c10-1a2b3c4d5e6f
              kind: letter
              code: A
      responses:
        '200':
          description: Activity recorded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      playbackId:
                        type: string
                        format: uuid
                        description: Only present for `voice-start`
        '400':
          description: Invalid activity (the body is `{ "success": false }`)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Administrators (`users.manage`) have no activity (body `{ "success": false }`)

  # ───────────────────────────── Daily challenges ─────────────────────────────
  /api/profile/challenges/today:
    get:
      summary: Get today's daily challenge and my progress
      description: |
        One challenge per user and day (Bogota time), the same for everyone that day. Does not create anything: without
        activity it shows zero progress. Answers `data: null` with a `message` when there are no active challenges or the
        account was deleted. Users with `users.manage` get `403`. See ADR-009.
      operationId: getTodayChallenge
      tags: [Challenges]
      responses:
        '200':
          description: Today's challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayChallengeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Administrators (`users.manage`) have no challenges (body `{ "success": false }`)

  /api/profile/challenges/rewards/summary:
    get:
      summary: Total of challenge points I have been granted
      description: |
        Sum of `challenge_rewards.points` of the authenticated user (0 if none). Excludes catalog points, partial progress and
        achievement points. Creates nothing. Users with `users.manage` get `403`. See ADR-010.
      operationId: getChallengeRewardSummary
      tags: [Challenges]
      responses:
        '200':
          description: Total points
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [totalPoints]
                    properties:
                      totalPoints:
                        type: integer
                        minimum: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Administrators (`users.manage`) have no challenges (body `{ "success": false }`)

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'

  schemas:
    ServiceHealth:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: profile-service

    UiLanguage:
      type: string
      enum: [ES, EN, FR, PT]

    Theme:
      type: string
      enum: [LIGHT, DARK]

    Preferences:
      type: object
      required: [uiLanguage, theme, notificationsEnabled]
      properties:
        uiLanguage:
          $ref: '#/components/schemas/UiLanguage'
        theme:
          $ref: '#/components/schemas/Theme'
        notificationsEnabled:
          type: boolean
        updatedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    PreferencesPatch:
      type: object
      minProperties: 1
      properties:
        uiLanguage:
          $ref: '#/components/schemas/UiLanguage'
        theme:
          $ref: '#/components/schemas/Theme'
        notificationsEnabled:
          type: boolean

    Profile:
      type: object
      required: [userId, fullName, preferences]
      properties:
        userId:
          type: string
          description: Logical id of iam-service, stored as text
        fullName:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        preferences:
          $ref: '#/components/schemas/Preferences'

    Notification:
      type: object
      required: [id, typeId, channel, title, body, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        typeId:
          type: string
          format: uuid
        typeCode:
          type: string
          description: Code of the type, e.g. `ACHIEVEMENT_UNLOCKED` or `CHALLENGE_COMPLETED`
        channel:
          type: string
          enum: [PUSH, EMAIL, IN_APP]
        title:
          type: string
        body:
          type: string
        referenceType:
          type: string
          enum: [ACHIEVEMENT, CHALLENGE]
        referenceId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, SENT, FAILED, READ, CANCELLED]
        sentAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        readAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    NotificationPage:
      type: object
      required: [data, meta, unreadCount]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        meta:
          $ref: './_shared.yaml#/components/schemas/PaginatedMeta'
        unreadCount:
          type: integer

    Achievement:
      type: object
      required: [id, code, name, description, metric, targetCount, points, isSecret, isActive]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: FIRST_TRANSLATION
        name:
          type: string
        description:
          type: string
        metric:
          type: string
          enum: [TRANSLATIONS_COMPLETED, SIGNS_LEARNED, ALPHABET_COMPLETED, SESSIONS_COMPLETED, CATALOG_REQUIREMENT, ACTIVE_SECONDS, VOICE_COMPLETED, FAVORITE_WORD, DISTINCT_WORDS, LETTERS_VIEWED, BOTH_MODES, TRANSLATION_DAYS, WORD_CATEGORIES, DAILY_CHALLENGE_POINTS]
          description: '`DAILY_CHALLENGE_POINTS` (ADR-010) is only listed when the query has `catalogVersion=2&challengeRewards=1`'
        targetCount:
          type: integer
        points:
          type: integer
        iconReference:
          type: string
        isSecret:
          type: boolean
        isActive:
          type: boolean

    AchievementProgress:
      type: object
      required: [achievement, currentCount, achievedAt]
      properties:
        achievement:
          $ref: '#/components/schemas/Achievement'
        currentCount:
          type: integer
        achievedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while in progress

    ActivityInput:
      type: object
      required: [sessionId, kind]
      properties:
        sessionId:
          type: string
          pattern: '^[a-zA-Z0-9-]{16,80}$'
        kind:
          type: string
          enum: [letter, tick, pause, voice-start, voice-end, voice-cancel]
        code:
          type: string
          description: Letter of the alphabet (only for `letter`)
        translationId:
          type: integer
          description: Only for `voice-start`
        playbackId:
          type: string
          format: uuid
          description: Only for `voice-end` and `voice-cancel`

    ChallengeText:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    TodayChallenge:
      type: object
      required: [challengeId, code, name, description, targetCount, currentCount, points, completed, date]
      properties:
        assignmentId:
          type: string
          format: uuid
          nullable: true
          description: Null until the first translation of the day creates the assignment
        reward:
          type: object
          nullable: true
          description: Points really granted and when; null if not completed
          properties:
            points:
              type: integer
            grantedAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
        localizations:
          type: object
          description: Texts of the snapshot by language (`es`, `en`, `fr`, `pt`)
          additionalProperties:
            $ref: '#/components/schemas/ChallengeText'
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          example: TRANSLATE_3
        name:
          type: string
          description: Localized with the interface language of the user
        description:
          type: string
        targetCount:
          type: integer
        currentCount:
          type: integer
        points:
          type: integer
          description: Planned reward
        completed:
          type: boolean
        completedAt:
          type: string
          format: date-time
          nullable: true
        date:
          type: string
          format: date
          description: Day of the challenge in Bogota time

    TodayChallengeResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          allOf:
            - $ref: '#/components/schemas/TodayChallenge'
          nullable: true
        message:
          type: string
          description: Present when `data` is null

  responses:
    BadRequest:
      description: Invalid body or query (`VALIDATION_ERROR`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid token (`UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
    NotFound:
      description: Profile or notification not found (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
    PermissionDenied:
      description: '`notificationsEnabled` was sent without the permission `notifications.manage` (`FORBIDDEN`)'
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
    AccountDeleted:
      description: The account was deleted (`ACCOUNT_DELETED`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
