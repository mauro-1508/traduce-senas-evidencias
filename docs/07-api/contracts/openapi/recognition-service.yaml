openapi: 3.0.3
info:
  title: Recognition Service API
  version: 1.0.0
  description: |
    Recognition & Translation service (`03-recognition-service`, internal port 3002, PostgreSQL db `recognition`
    plus MongoDB collection `gesture_samples`). It stores the translation history, the sign templates used by the
    recognizer in the client, and the gesture samples (landmarks only, never video).

    **Based on:** Backend `2993301` (`origin/develop`, 2026-10-16), `services/recognition-service`. Every path below exists in
    the code; routes that are only planned (`/api/models*`, sample validation, session deletion) are listed in
    `07-api/README.md` ("Planned, not implemented").

    Public paths served through the gateway: `/api/translations/**`, `/api/recognition/**`, `/api/sign-templates/**`
    (deprecated alias), `/api/samples/**`. Port 3002 is internal: use the gateway at `http://localhost:8080`.

    ## Access rules
    - `/api/translations/**`: any valid JWT. The user id always comes from the token, never from the body or the query.
    - Sign templates: `GET` is public (the translation screen downloads them before login). `POST` and `DELETE`
      need a JWT with the permission `models.manage`.
    - `/api/samples/**`: JWT with the `ADMIN` role (the samples are biometric data, Law 1581 of 2012).
    - Deleted accounts: saving a translation, creating or deleting a sign template and registering a sample with the JWT of
      an account already deleted answers `401 ACCOUNT_DELETED` (`erased_users` is checked in the same transaction as the write).

    ## Response format
    Success: `{ "success": true, "message"?: string, "data"?: any }`.
    Error: `{ "success": false, "code"?: string, "message": string }` (`ApiError` in `_shared.yaml`). Every error carries a `code`: invalid input answers `400 VALIDATION_ERROR`, an unknown id `404 NOT_FOUND`, a deleted account `401 ACCOUNT_DELETED` and a permission check `403` (`PERMISSION_ERROR` or `FORBIDDEN`). Any other failure answers `500 INTERNAL_ERROR` without internal details.

    ## Events
    Publishes `recognition.TranslationProduced` `{ translationId, userId, gloss, text, occurredAt }` after each saved translation.
    Consumes `lexicon.SignPublished` and `lexicon.SignWithdrawn` (only logged for now), and `iam.UserDeleted`: deletes the
    user's translations, records the user in `erased_users` and unlinks the gesture samples they recorded (the samples are kept
    without the operator id).

    ## Scope note
    The `type` of a translation accepts `texto_sena`, `sena_texto` and `voz_sena`, although the MVP only covers sign to text (`sena_texto`).

servers:
  - url: http://localhost:8080
    description: Local development through the api-gateway (the only port published by Docker Compose). The service itself listens on port 3002 inside the network.

security:
  - bearerAuth: []

tags:
  - name: Translations
    description: Translation history and statistics
  - name: Sign templates
    description: Reference gestures used by the recognizer
  - name: Samples
    description: Gesture samples for training (ADMIN)
  - name: Health
    description: Service status (internal)

paths:
  /health:
    servers:
      - url: http://localhost:3002
        description: Internal port of the service (not routed by the gateway; the gateway has its own `/health`)
    get:
      summary: Health check
      operationId: health
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'

  # ───────────────────────────── Translations ─────────────────────────────
  /api/translations:
    post:
      summary: Save a translation
      description: Saves the result of a recognition for the authenticated user and publishes `recognition.TranslationProduced`. If `inputText` is empty, `outputText` is used.
      operationId: createTranslation
      tags: [Translations]
      x-requirements: [FR-401, FR-403, FR-404, HU-TRA-001, HU-TRA-003]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTranslationRequest'
            example:
              inputText: HOLA
              outputText: Hola
              type: sena_texto
              confidence: 0.86
              source: mediapipe
      responses:
        '201':
          description: Translation saved
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Traduccion guardada
                  data:
                    $ref: '#/components/schemas/Translation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/translations/stats:
    get:
      summary: Translation statistics (administrator)
      description: Needs the permission `stats.read`. Dates are grouped in Colombia time (UTC-5). Missing days, weeks and months are filled with zero.
      operationId: getTranslationStats
      tags: [Translations]
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TranslationStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permission (`PERMISSION_ERROR`)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ApiError'

  /api/translations/me/stats:
    get:
      summary: My translation statistics
      description: Counters of the authenticated user for the profile screen. Needs only a valid token.
      operationId: getMyTranslationStats
      tags: [Translations]
      responses:
        '200':
          description: Counters
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/MyStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/translations/history:
    get:
      summary: My translation history
      description: Newest first. Deleted translations are not returned.
      operationId: listTranslations
      tags: [Translations]
      x-requirements: [FR-406, HU-TRA-005]
      parameters:
        - name: limit
          in: query
          description: Page size (default 50, between 1 and 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Translations of the authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Translation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/translations/{id}:
    delete:
      summary: Delete a translation from my history
      description: Soft delete (`isDeleted = true`). A translation that does not exist or belongs to another user answers `404 NOT_FOUND` ("Traduccion no encontrada").
      operationId: deleteTranslation
      tags: [Translations]
      x-requirements: [FR-407, HU-TRA-006]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Translation deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Traduccion eliminada
                  data:
                    type: object
                    properties:
                      translationId:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────────────────────────── Sign templates ─────────────────────────────
  /api/recognition/sign-templates:
    get:
      summary: List sign templates
      description: Public. `static` templates are one frame of 63 values (one hand); `motion` templates are 16 frames of 126 values (two hands).
      operationId: listSignTemplates
      tags: [Sign templates]
      security: []
      x-requirements: [FR-401]
      parameters:
        - $ref: '#/components/parameters/TemplateKindParam'
        - name: label
          in: query
          description: Filter by label
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/TemplateList'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: Import sign templates
      description: |
        Needs the permission `models.manage`. Accepts either `gestures` (the format exported by the app and produced by the dataset converter)
        or `templates` (explicit). The whole batch is rejected if one template is invalid.
      operationId: importSignTemplates
      tags: [Sign templates]
      x-requirements: [FR-401]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportTemplatesRequest'
      responses:
        '201':
          description: Templates imported; `data` lists the new ids
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: 20 plantillas importadas
                  data:
                    type: array
                    items:
                      type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/recognition/sign-templates/{id}:
    delete:
      summary: Delete a sign template
      description: Needs the permission `models.manage`. An unknown id answers `404 NOT_FOUND` ("Plantilla no encontrada").
      operationId: deleteSignTemplate
      tags: [Sign templates]
      x-requirements: [FR-401]
      parameters:
        - $ref: '#/components/parameters/TemplateIdParam'
      responses:
        '200':
          description: Template deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Plantilla eliminada
                  data:
                    $ref: '#/components/schemas/SignTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/sign-templates:
    get:
      summary: List sign templates (deprecated alias)
      description: Same as `GET /api/recognition/sign-templates`. Kept for the current frontend; use the `/api/recognition/sign-templates` path.
      operationId: listSignTemplatesLegacy
      deprecated: true
      tags: [Sign templates]
      security: []
      parameters:
        - $ref: '#/components/parameters/TemplateKindParam'
        - name: label
          in: query
          description: Filter by label
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/TemplateList'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: Import sign templates (deprecated alias)
      description: Same as `POST /api/recognition/sign-templates`.
      operationId: importSignTemplatesLegacy
      deprecated: true
      tags: [Sign templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportTemplatesRequest'
      responses:
        '201':
          description: Templates imported; `data` lists the new ids
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/sign-templates/{id}:
    delete:
      summary: Delete a sign template (deprecated alias)
      description: Same as `DELETE /api/recognition/sign-templates/{id}`.
      operationId: deleteSignTemplateLegacy
      deprecated: true
      tags: [Sign templates]
      parameters:
        - $ref: '#/components/parameters/TemplateIdParam'
      responses:
        '200':
          description: Template deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/SignTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ───────────────────────────── Samples ─────────────────────────────
  /api/samples:
    post:
      summary: Register a gesture sample (ADMIN)
      description: |
        Stores one repetition of a sign as landmark frames. Without consent data (date and terms version) the sample is rejected.
        The sample is created with `isValidated = false`. Without `MONGO_URL` the samples are kept in memory and lost on restart.
      operationId: createSample
      tags: [Samples]
      x-requirements: [FR-601, FR-602, HU-AI-001, HU-AI-002]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSampleRequest'
      responses:
        '201':
          description: Sample stored
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Muestra guardada
                  data:
                    $ref: '#/components/schemas/GestureSample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      summary: List gesture samples (ADMIN)
      description: Newest first, optionally for one sign.
      operationId: listSamples
      tags: [Samples]
      x-requirements: [FR-601, FR-604, HU-AI-001, HU-AI-003]
      parameters:
        - name: signCode
          in: query
          description: Sign code as in lexicon-service
          schema:
            type: string
      responses:
        '200':
          description: Samples
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GestureSample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    TemplateIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TemplateKindParam:
      name: kind
      in: query
      schema:
        $ref: '#/components/schemas/TemplateKind'

  schemas:
    ServiceHealth:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: recognition-service

    TranslationType:
      type: string
      enum: [texto_sena, sena_texto, voz_sena]

    CreateTranslationRequest:
      type: object
      required: [outputText, type]
      properties:
        inputText:
          type: string
          description: Gloss or source text; defaults to `outputText`
        outputText:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/TranslationType'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: string
          maxLength: 20
          description: Informative only (for example `mediapipe`, `knn`, `mock`, `manual`)

    Translation:
      type: object
      required: [translationId, inputText, outputText, type, isDeleted, createdAt]
      properties:
        translationId:
          type: integer
        userId:
          type: integer
          nullable: true
          description: Logical id of iam-service (no foreign key)
        inputText:
          type: string
        outputText:
          type: string
        type:
          $ref: '#/components/schemas/TranslationType'
        confidence:
          type: number
          nullable: true
        source:
          type: string
          nullable: true
        isDeleted:
          type: boolean
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    TranslationStats:
      type: object
      required: [totalTranslations, activeUsers30d, daily, weekly, monthly]
      properties:
        totalTranslations:
          type: integer
        activeUsers30d:
          type: integer
          description: Distinct users with a translation in the last 30 days
        daily:
          type: array
          description: Last 7 days, oldest first
          items:
            type: object
            required: [date, count]
            properties:
              date:
                type: string
                format: date
              count:
                type: integer
        weekly:
          type: array
          description: Last 4 weeks, oldest first
          items:
            type: object
            required: [weekStart, count]
            properties:
              weekStart:
                type: string
                format: date
                description: Monday of the week
              count:
                type: integer
        monthly:
          type: array
          description: Last 12 months, oldest first
          items:
            type: object
            required: [month, count]
            properties:
              month:
                type: string
                example: 2026-10
              count:
                type: integer

    MyStats:
      type: object
      required: [totalTranslations, distinctWords, activeDays]
      properties:
        totalTranslations:
          type: integer
        distinctWords:
          type: integer
        activeDays:
          type: integer
          description: Distinct calendar days (Colombia time) with a translation

    TemplateKind:
      type: string
      description: '`static` = alphabet letter (1 frame x 63 values); `motion` = word (16 frames x 126 values)'
      enum: [static, motion]

    SignTemplate:
      type: object
      required: [templateId, label, kind, features, source, createdAt]
      properties:
        templateId:
          type: integer
        label:
          type: string
        kind:
          $ref: '#/components/schemas/TemplateKind'
        features:
          type: array
          description: Frames of landmark features
          items:
            type: array
            items:
              type: number
        source:
          type: string
          example: lsc54
        createdBy:
          type: integer
          nullable: true
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    ImportTemplatesRequest:
      type: object
      description: Send `gestures` (with optional `kind` and `source`) or `templates`.
      properties:
        kind:
          $ref: '#/components/schemas/TemplateKind'
        source:
          type: string
          description: Applied to every gesture (default `lsc54`)
        gestures:
          type: array
          items:
            type: object
            required: [label, frames]
            properties:
              label:
                type: string
              frames:
                type: array
                items:
                  type: array
                  items:
                    type: number
        templates:
          type: array
          items:
            type: object
            required: [label, kind, features]
            properties:
              label:
                type: string
              kind:
                $ref: '#/components/schemas/TemplateKind'
              features:
                type: array
                items:
                  type: array
                  items:
                    type: number
              source:
                type: string

    CreateSampleRequest:
      type: object
      required: [signCode, captureSessionId, performedBy, consentGrantedAt, consentTermsVersion, frames]
      properties:
        signCode:
          type: string
          maxLength: 50
        captureSessionId:
          type: string
          maxLength: 64
          description: Groups the repetitions of one recording session
        performedBy:
          type: string
          maxLength: 150
          description: Name of the person who signed
        consentGrantedAt:
          type: string
          format: date-time
        consentTermsVersion:
          type: string
          maxLength: 20
        frames:
          type: array
          minItems: 1
          maxItems: 64
          description: Every frame has the same length, 63 or 126 numbers
          items:
            type: array
            items:
              type: number

    GestureSample:
      type: object
      required: [sampleId, signCode, captureSessionId, recordedBy, performedBy, consentGrantedAt, consentTermsVersion, frames, isValidated, createdAt]
      properties:
        sampleId:
          type: string
          description: UUID generated by the service
        signCode:
          type: string
        captureSessionId:
          type: string
        recordedBy:
          type: integer
          description: Administrator who operated the recording (iam user id)
        performedBy:
          type: string
        consentGrantedAt:
          type: string
          format: date-time
        consentTermsVersion:
          type: string
        frames:
          type: array
          items:
            type: array
            items:
              type: number
        isValidated:
          type: boolean
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

  responses:
    TemplateList:
      description: Sign templates
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: '#/components/schemas/SignTemplate'
    BadRequest:
      description: Invalid input (`VALIDATION_ERROR`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
    NotFound:
      description: The translation or sign template does not exist (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid token (`UNAUTHORIZED`), or, on write routes, token of a deleted account (`ACCOUNT_DELETED`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
    Forbidden:
      description: The token lacks the required role or permission (`FORBIDDEN`)
      content:
        application/json:
          schema:
            $ref: './_shared.yaml#/components/schemas/ApiError'
