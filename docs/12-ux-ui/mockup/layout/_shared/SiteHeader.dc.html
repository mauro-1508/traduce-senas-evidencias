<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../_shared/fonts/nunito-sans.css">
<script src="../_shared/vendor/lucide.min.js"></script>
</helmet>
<sc-if value="{{ isPublic }}" hint-placeholder-val="{{ true }}">
  <div style="position:relative;">
  <header style="position:fixed; top:0; left:0; right:0; background:rgba(255,255,255,0.92); backdrop-filter:blur(8px); border-bottom:1px solid #F1EEF9; z-index:100; font-family:'Nunito Sans',system-ui,sans-serif;">
    <div style="max-width:1200px; margin:0 auto; display:flex; align-items:center; gap:32px; padding:16px 40px;">
      <a href="../view-landing/index.html" style="display:flex; align-items:center; gap:12px; flex-shrink:0; text-decoration:none;">
        <span style="width:44px; height:44px; border-radius:13px; background:#EDE9FE; display:flex; align-items:center; justify-content:center;"><img src="../_shared/assets/icono-señas.png" alt="TraduceSeña" style="width:40px; height:40px; object-fit:contain; display:block;"></span>
        <div style="line-height:1;">
          <div style="font-size:20px; font-weight:800; color:#1F2937; letter-spacing:-0.3px;">TraduceSeña</div>
          <div style="font-size:11px; color:#9CA3AF; font-weight:600; margin-top:3px;">Lengua de señas para todos</div>
        </div>
      </a>
      <nav style="flex:1; display:flex; align-items:center; justify-content:center; gap:34px;">
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="4">
          <a href="{{ item.href }}" style="{{ item.style }}"><sc-if value="{{ item.active }}" hint-placeholder-val=""><i data-lucide="{{ item.icon }}" style="width:17px; height:17px;"></i></sc-if>{{ item.label }}</a>
        </sc-for>
      </nav>
      <div style="display:flex; align-items:center; gap:12px; flex-shrink:0;">
        <a href="../sign-in/index.html" style="display:flex; align-items:center; gap:9px; height:44px; padding:0 20px; border-radius:999px; border:1.5px solid #C4B5FD; background:transparent; color:#9B77E6; font-family:inherit; font-size:15px; font-weight:700; text-decoration:none;" style-hover="background:#EDE9FE; border-color:#9B77E6;">
          <i data-lucide="user" style="width:18px; height:18px;"></i>Iniciar sesión
        </a>
        <a href="../register-account/index.html" style="display:flex; align-items:center; gap:9px; height:44px; padding:0 22px; border-radius:999px; border:none; background:linear-gradient(135deg,#BE9EF4,#D4C2F3); color:#fff; font-family:inherit; font-size:15px; font-weight:700; text-decoration:none; box-shadow:0 4px 12px rgba(124,58,237,0.24);" style-hover="background:#AD8AEF;">Registrarse</a>
      </div>
    </div>
  </header>
  <div style="height:73px;"></div>
  </div>
</sc-if>

<sc-if value="{{ isApp }}" hint-placeholder-val="">
  <header style="position:sticky; top:0; background:rgba(255,255,255,0.92); backdrop-filter:blur(8px); border-bottom:1px solid #F1EEF9; z-index:30; font-family:'Plus Jakarta Sans',system-ui,sans-serif;">
    <div style="max-width:1500px; margin:0 auto; display:flex; align-items:center; gap:22px; padding:14px 26px;">
      <a href="../view-landing/index.html" style="display:flex; align-items:center; gap:12px; flex-shrink:0; text-decoration:none;">
                <span data-app-icon="1" style="width:44px; height:44px; border-radius:13px; background:#EDE9FE; display:flex; align-items:center; justify-content:center;"><img src="../_shared/assets/icono-señas.png" alt="TraduceSeña" style="width:40px; height:40px; object-fit:contain; display:block;"></span>
        <div style="font-size:20px; font-weight:800; color:#1F2937; letter-spacing:-0.3px;">TraduceSeña</div>
      </a>

      <nav style="flex:1; display:flex; align-items:center; justify-content:center; gap:8px;">
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="5">
          <a href="{{ item.href }}" style="{{ item.style }}"><sc-if value="{{ item.active }}" hint-placeholder-val=""><i data-lucide="{{ item.icon }}" style="width:17px; height:17px;"></i></sc-if>{{ item.label }}</a>
        </sc-for>
      </nav>

      <div style="display:flex; align-items:center; gap:12px; flex-shrink:0; position:relative;">
        <span style="width:1px; height:32px; background:#EEE9FA; margin-right:2px;"></span>
        <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ toggleDark }}" aria-label="Activar tema oscuro" style="width:44px; height:44px; border-radius:12px; border:1px solid #EEE9FA; background:#FBFAFE; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#7C3AED;" style-hover="background:#F4F1FC;"><i data-lucide="moon" style="width:20px; height:20px;"></i></button>
        </sc-if>
        <sc-if value="{{ isDark }}" hint-placeholder-val="">
          <button onClick="{{ toggleDark }}" aria-label="Activar tema claro" style="width:44px; height:44px; border-radius:12px; border:1px solid #7C3AED; background:#7C3AED; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; box-shadow:0 4px 12px rgba(124,58,237,0.3);" style-hover="filter:brightness(1.08);"><i data-lucide="sun" style="width:20px; height:20px;"></i></button>
        </sc-if>
        <div style="position:relative;">
          <button onClick="{{ toggleLang }}" style="display:flex; align-items:center; gap:10px; height:44px; padding:0 14px; border-radius:12px; border:1px solid #EEE9FA; background:#FBFAFE; color:#1F2937; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;" style-hover="background:#F4F1FC;">
            <i data-lucide="globe" style="width:18px; height:18px; color:#7C3AED;"></i>{{ lang }}<i data-lucide="chevron-down" style="width:16px; height:16px; color:#9CA3AF;"></i>
          </button>
          <sc-if value="{{ langOpen }}" hint-placeholder-val="">
            <div style="position:absolute; top:52px; right:0; width:220px; background:#FFFFFF; border:1px solid #EEE9FA; border-radius:14px; padding:8px; box-shadow:0 24px 50px rgba(80,60,140,0.16); z-index:40;">
              <sc-for list="{{ langs }}" as="l" hint-placeholder-count="4">
                <button onClick="{{ l.onClick }}" style="width:100%; display:flex; align-items:center; gap:12px; height:44px; padding:0 12px; border:none; border-radius:10px; background:{{ l.bg }}; color:#1F2937; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; text-align:left;" style-hover="background:#F4F1FC;">
                  <span style="font-size:20px;">{{ l.flag }}</span><span style="flex:1;">{{ l.name }}</span>
                  <sc-if value="{{ l.active }}" hint-placeholder-val=""><i data-lucide="check" style="width:17px; height:17px; color:#7C3AED;"></i></sc-if>
                </button>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <a href="../manage-profile/index.html" style="display:flex; align-items:center; gap:10px; height:44px; padding:4px 14px 4px 6px; border-radius:999px; border:1px solid #EEE9FA; background:#FBFAFE; text-decoration:none;" style-hover="background:#F4F1FC;">
          <span style="width:34px; height:34px; border-radius:999px; background:linear-gradient(135deg,#A78BFA,#7C3AED); display:flex; align-items:center; justify-content:center; overflow:hidden;">
            <sc-if value="{{ hasAvatar }}" hint-placeholder-val=""><img src="{{ avatar }}" alt="" style="width:100%; height:100%; object-fit:cover;"></sc-if>
            <sc-if value="{{ noAvatar }}" hint-placeholder-val="{{ true }}"><i data-lucide="user-round" style="width:18px; height:18px; color:#fff;"></i></sc-if>
          </span>
          <span style="max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; font-weight:700; color:#1F2937;">{{ userName }}</span>
        </a>
      </div>
    </div>
  </header>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:78},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;public&quot;,&quot;app&quot;],&quot;default&quot;:&quot;public&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;traductor&quot;,&quot;alfabeto&quot;,&quot;nosotros&quot;,&quot;estadisticas&quot;,&quot;historial&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let dark = false, accent = "purple", lang = "ES", userName = (typeof window !== "undefined" && window.__tsRole === "admin" ? "Admin" : "Usuario");
    try { const p = JSON.parse(localStorage.getItem("ts-prefs") || "{}"); if (typeof p.dark === "boolean") dark = p.dark; if (p.accent) accent = p.accent; if (p.lang) lang = p.lang; } catch (e) {}
    try { const pr = JSON.parse(localStorage.getItem("ts-profile") || "{}"); if (pr && pr.name) userName = pr.name; } catch (e) {}
    let avatar = "";
    try { const pr = JSON.parse(localStorage.getItem("ts-profile") || "{}"); if (pr && pr.avatar) avatar = pr.avatar; } catch (e) {}
    this.state = { dark, accent, langOpen: false, lang, userName, avatar };
  }
  renderVals() {
    const active = this.props.active || "inicio";
    const mode = this.props.mode || "public";
    const s = this.state;
    const publicItems = [
      { key: "inicio", label: "Inicio", href: "../view-landing/index.html", icon: "home" },
      { key: "traductor", label: "Traductor", href: "../try-translator-demo/index.html", icon: "languages" },
      { key: "alfabeto", label: "Alfabeto", href: "../try-alphabet-demo/index.html", icon: "whole-word" },
      { key: "nosotros", label: "Nosotros", href: "../view-about-us/index.html", icon: "users" }
    ];
    const appItems = [
      { key: "traductor", label: "Traductor", href: "../translate-signs/index.html", icon: "languages" },
      { key: "alfabeto", label: "Alfabeto", href: "../view-alphabet/index.html", icon: "whole-word" },
      { key: "estadisticas", label: "Estadísticas", href: "../view-usage-statistics/index.html", icon: "bar-chart-3" },
      { key: "historial", label: "Historial", href: "../view-translation-history/index.html", icon: "history" },
      { key: "admin", label: "Admin", href: "../view-admin-dashboard/index.html", icon: "shield" }
    ];
    const isApp = mode === "app";
    // Rol: el administrador solo ve Estadisticas y Admin; el usuario no ve ninguna de las dos.
    const role = this.props.role || (typeof window !== "undefined" && window.__tsRole) || "user";
    const allowed = role === "admin" ? ["estadisticas", "admin"] : ["traductor", "alfabeto", "historial"];
    const items = isApp ? appItems.filter(function (it) { return allowed.indexOf(it.key) >= 0; }) : publicItems;

    const pill = "display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 16px; border-radius:12px; text-decoration:none; font-size:15px; transition:background .15s, color .15s;";
    const publicBase = "display:inline-flex; align-items:center; gap:7px; text-decoration:none; font-size:15px; padding-bottom:5px; border-bottom:2px solid transparent;";
    const langData = [
      { code: "ES", name: "Español", flag: "🇪🇸" }, { code: "EN", name: "English", flag: "🇺🇸" },
      { code: "PT", name: "Português", flag: "🇧🇷" }, { code: "FR", name: "Français", flag: "🇫🇷" }
    ];
    const curLang = langData.find(l => l.code === s.lang) || langData[0];
    const green = s.accent === "green";
    const iconBg = s.dark
      ? (green ? "rgba(16,185,129,0.22)" : "rgba(139,92,246,0.22)")
      : (green ? "#DCF5EA" : "#EDE9FE");
    return {
      isApp, isPublic: !isApp,
      userName: (s.userName || (typeof window !== "undefined" && window.__tsRole === "admin" ? "Admin" : "Usuario")).trim().split(/\s+/)[0],
      avatar: s.avatar, hasAvatar: !!s.avatar, noAvatar: !s.avatar,
      iconBg,
      iconFilter: s.dark ? "invert(1) brightness(1.6)" : "none",
      nav: items.map(it => {
        const on = it.key === active;
        const style = isApp
          ? (on ? pill + " background:#EDE9FE; border:1px solid #EEE9FA; color:#6D28D9; font-weight:700;"
                : pill + " color:#6B7280; font-weight:600;")
          : (on ? publicBase + " font-weight:700; color:#9B77E6; border-bottom-color:#9B77E6;"
                : publicBase + " font-weight:600; color:#4B5563;");
        return { active: on, icon: it.icon || "circle", label: it.label, href: it.href, style };
      }),
      isDark: s.dark, isLight: !s.dark,
      toggleDark: () => {
        const dark = !this.state.dark;
        try { const pr = JSON.parse(localStorage.getItem("ts-prefs") || "{}") || {}; pr.dark = dark; localStorage.setItem("ts-prefs", JSON.stringify(pr)); } catch (e) {}
        this.setState({ dark });
        if (window.__tsApplyTheme) requestAnimationFrame(() => window.__tsApplyTheme());
        window.dispatchEvent(new CustomEvent("ts-prefs-change"));
      },
      lang: curLang.name, langOpen: s.langOpen,
      toggleLang: () => this.setState(st => ({ langOpen: !st.langOpen })),
      langs: langData.map(l => ({
        name: l.name, flag: l.flag, active: l.code === s.lang,
        bg: l.code === s.lang ? "#EDE9FE" : "transparent",
        onClick: () => {
          try { const pr = JSON.parse(localStorage.getItem("ts-prefs") || "{}") || {}; pr.lang = l.code; localStorage.setItem("ts-prefs", JSON.stringify(pr)); } catch (e) {}
          this.setState({ lang: l.code, langOpen: false });
          window.dispatchEvent(new CustomEvent("ts-prefs-change"));
        }
      }))
    };
  }
  componentDidMount() {
    this._sync = () => { try { const p = JSON.parse(localStorage.getItem("ts-prefs") || "{}") || {}; const pr = JSON.parse(localStorage.getItem("ts-profile") || "{}") || {}; this.setState({ dark: !!p.dark, accent: p.accent || "purple", lang: p.lang || "ES", userName: pr.name || (typeof window !== "undefined" && window.__tsRole === "admin" ? "Admin" : "Usuario"), avatar: pr.avatar || "" }); } catch (e) {} };
    window.addEventListener("ts-prefs-change", this._sync);
    this._ensure();
  }
  componentDidUpdate() { this._icons(); }
  _icons() { if (window.lucide) { cancelAnimationFrame(this._raf); this._raf = requestAnimationFrame(() => window.lucide.createIcons()); } else this._ensure(); }
  _ensure() { let n=0; clearInterval(this._t); this._t=setInterval(()=>{ if(window.lucide) window.lucide.createIcons(); const left=document.querySelectorAll('i[data-lucide]').length; if(left===0 || ++n>=120) clearInterval(this._t); },100); }
  componentWillUnmount() { clearInterval(this._t); cancelAnimationFrame(this._raf); window.removeEventListener("ts-prefs-change", this._sync); }
}
</script>
</body>
</html>
