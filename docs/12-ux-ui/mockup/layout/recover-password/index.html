<body>
<noscript><div role="alert" style="padding:14px 20px; background:#7F1D1D; color:#fff; font:700 16px/1.45 system-ui,sans-serif; text-align:center;">Esta pantalla necesita JavaScript activado para mostrarse completa.</div></noscript>
<x-dc>
<helmet>
<link rel="stylesheet" href="../_shared/theme.css">
<script src="../_shared/theme-boot.js"></script>
<link rel="stylesheet" href="../_shared/fonts/nunito-sans.css">
<script src="../_shared/vendor/lucide.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #1F2937; background: #EDE7FB; -webkit-font-smoothing: antialiased; }
  a { color: #9B77E6; text-decoration: none; }
  ::selection { background: #EDE9FE; }
  .lucide { stroke-width: 2; }
  input::placeholder { color: #A6A0B4; }
</style>
</helmet>
<div style="width:100%; min-height:100vh; overflow-y:auto; background:linear-gradient(160deg,#F3EFFB 0%,#EDE7FB 100%); position:relative; display:flex; align-items:center; justify-content:center; padding:88px 40px 32px;">

  <button onClick="{{ back }}" aria-label="Volver" style="position:absolute; top:26px; left:26px; z-index:10; width:48px; height:48px; border-radius:14px; background:#fff; border:1px solid #E7DEF8; display:flex; align-items:center; justify-content:center; color:#7E5AD0; box-shadow:0 4px 12px rgba(124,58,237,0.10); cursor:pointer;" style-hover="background:#F1EBFC;">
    <i data-lucide="arrow-left" style="width:22px; height:22px;"></i>
  </button>

  <div style="width:100%; max-width:460px;">
    <!-- stepper -->
    <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:26px;">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="3">
        <div style="width:{{ d.w }}; height:8px; border-radius:999px; background:{{ d.bg }}; transition:all .25s;"></div>
      </sc-for>
    </div>

    <div style="background:#fff; border-radius:26px; padding:38px 36px; box-shadow:0 20px 46px rgba(30,20,60,0.12);">
      <div style="width:64px; height:64px; margin:0 auto 18px; border-radius:18px; background:#EFEBFD; display:flex; align-items:center; justify-content:center;"><i data-lucide="{{ icon }}" style="width:30px; height:30px; color:#9B77E6;"></i></div>
      <div style="font-size:13px; font-weight:800; letter-spacing:0.6px; color:#B4AEC2; text-align:center; text-transform:uppercase; margin-bottom:6px;">Paso {{ stepNum }} de 3</div>
      <h1 style="font-size:24px; font-weight:800; color:#1F2937; text-align:center; margin:0 0 8px; letter-spacing:-0.4px;">{{ title }}</h1>
      <p style="font-size:14px; line-height:1.55; color:#9CA3AF; text-align:center; margin:0 0 26px; font-weight:600;">{{ subtitle }}</p>

      <!-- STEP 1: email -->
      <sc-if value="{{ isStep1 }}" hint-placeholder-val="{{ true }}">
        <div>
          <label style="display:block; font-size:13px; font-weight:800; color:#4B5563; margin-bottom:8px;">Email</label>
          <div style="display:flex; align-items:center; gap:10px; background:#FBFAFE; border:1.5px solid {{ emailBorder }}; border-radius:12px; height:52px; padding:0 16px; margin-bottom:{{ emailGap }};">
            <i data-lucide="mail" style="width:19px; height:19px; color:#9B77E6;"></i>
            <input type="email" value="{{ email }}" onInput="{{ onEmail }}" placeholder="tucorreo@ejemplo.com" style="flex:1; border:none; background:transparent; outline:none; font-family:inherit; font-size:15px; color:#1F2937;">
          </div>
          <sc-if value="{{ emailError }}" hint-placeholder-val="">
            <div style="display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:#EF4444; margin-bottom:16px;"><i data-lucide="alert-circle" style="width:14px; height:14px;"></i>{{ emailError }}</div>
          </sc-if>
          <button onClick="{{ next }}" style="width:100%; display:flex; align-items:center; justify-content:center; gap:9px; height:52px; border:none; border-radius:12px; background:#BE9EF4; color:#fff; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(124,58,237,0.24);" style-hover="background:#AD8AEF;">Enviar código <i data-lucide="send" style="width:17px; height:17px;"></i></button>
        </div>
      </sc-if>

      <!-- STEP 2: otp -->
      <sc-if value="{{ isStep2 }}" hint-placeholder-val="">
        <div>
          <div style="display:flex; gap:9px; margin-bottom:{{ otpGap }};">
            <sc-for list="{{ otpCells }}" as="c" hint-placeholder-count="6">
              <input value="{{ c.v }}" onInput="{{ c.onInput }}" onKeyDown="{{ c.onKey }}" data-otp="{{ c.i }}" maxlength="1" inputmode="numeric" style="flex:1; width:100%; text-align:center; aspect-ratio:1/1.15; border:1.5px solid {{ c.border }}; border-radius:12px; background:#FBFAFE; font-family:inherit; font-size:22px; font-weight:800; color:#1F2937; outline:none;">
            </sc-for>
          </div>
          <sc-if value="{{ otpError }}" hint-placeholder-val="">
            <div style="display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:#EF4444; margin-bottom:14px;"><i data-lucide="alert-circle" style="width:14px; height:14px;"></i>{{ otpError }}</div>
          </sc-if>
          <div style="font-size:13px; color:#9CA3AF; font-weight:600; text-align:center; margin-bottom:20px;">¿No lo recibiste? <a href="#" onClick="{{ noop }}" style="font-weight:800;">Reenviar código</a></div>
          <button onClick="{{ next }}" style="width:100%; display:flex; align-items:center; justify-content:center; gap:9px; height:52px; border:none; border-radius:12px; background:#BE9EF4; color:#fff; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(124,58,237,0.24);" style-hover="background:#AD8AEF;">Verificar <i data-lucide="arrow-right" style="width:17px; height:17px;"></i></button>
        </div>
      </sc-if>

      <!-- STEP 3: new password -->
      <sc-if value="{{ isStep3 }}" hint-placeholder-val="">
        <div>
          <label style="display:block; font-size:13px; font-weight:800; color:#4B5563; margin-bottom:8px;">Nueva contraseña</label>
          <div style="display:flex; align-items:center; gap:10px; background:#FBFAFE; border:1.5px solid {{ pwBorder }}; border-radius:12px; height:52px; padding:0 16px; margin-bottom:14px;">
            <i data-lucide="lock" style="width:19px; height:19px; color:#9B77E6;"></i>
            <input type="{{ pwType }}" value="{{ pw }}" onInput="{{ onPw }}" placeholder="Mínimo 8 caracteres" style="flex:1; border:none; background:transparent; outline:none; font-family:inherit; font-size:15px; color:#1F2937;">
            <span onClick="{{ togglePw }}" style="display:flex; cursor:pointer;"><i data-lucide="{{ pwIcon }}" style="width:19px; height:19px; color:#A6A0B4;"></i></span>
          </div>
          <label style="display:block; font-size:13px; font-weight:800; color:#4B5563; margin-bottom:8px;">Confirmar contraseña</label>
          <div style="display:flex; align-items:center; gap:10px; background:#FBFAFE; border:1.5px solid {{ pw2Border }}; border-radius:12px; height:52px; padding:0 16px; margin-bottom:{{ pwGap }};">
            <i data-lucide="lock" style="width:19px; height:19px; color:#9B77E6;"></i>
            <input type="{{ pw2Type }}" value="{{ pw2 }}" onInput="{{ onPw2 }}" placeholder="••••••••" style="flex:1; border:none; background:transparent; outline:none; font-family:inherit; font-size:15px; color:#1F2937;">
            <span onClick="{{ togglePw2 }}" style="display:flex; cursor:pointer;"><i data-lucide="{{ pw2Icon }}" style="width:19px; height:19px; color:#A6A0B4;"></i></span>
          </div>
          <sc-if value="{{ pwError }}" hint-placeholder-val="">
            <div style="display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:#EF4444; margin-bottom:16px;"><i data-lucide="alert-circle" style="width:14px; height:14px;"></i>{{ pwError }}</div>
          </sc-if>
          <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:18px;">
            <sc-for list="{{ reqs }}" as="r" hint-placeholder-count="4">
              <div style="display:flex; align-items:center; gap:9px;">
                <sc-if value="{{ r.met }}" hint-placeholder-val=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><path d="m9 11 3 3L22 4"></path></svg></sc-if>
                <sc-if value="{{ r.notMet }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C4B5FD" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg></sc-if>
                <span style="font-size:13px; font-weight:600; color:#6B7280;">{{ r.label }}</span>
              </div>
            </sc-for>
          </div>
          <button onClick="{{ next }}" style="width:100%; display:flex; align-items:center; justify-content:center; gap:9px; height:52px; border:none; border-radius:12px; background:#BE9EF4; color:#fff; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(124,58,237,0.24);" style-hover="background:#AD8AEF;">Guardar contraseña <i data-lucide="check" style="width:18px; height:18px;"></i></button>
        </div>
      </sc-if>

      <!-- SUCCESS -->
      <sc-if value="{{ isDone }}" hint-placeholder-val="">
        <div style="text-align:center;">
          <div style="width:76px; height:76px; margin:0 auto 20px; border-radius:999px; background:#DCF5EA; display:flex; align-items:center; justify-content:center;"><i data-lucide="check" style="width:38px; height:38px; color:#10B981;"></i></div>
          <h2 style="font-size:22px; font-weight:800; color:#1F2937; margin:0 0 8px;">¡Contraseña actualizada!</h2>
          <p style="font-size:14px; line-height:1.55; color:#6B7280; margin:0 0 24px;">Ya puedes iniciar sesión con tu nueva contraseña.</p>
          <a href="../sign-in/index.html" style="display:flex; align-items:center; justify-content:center; gap:9px; height:52px; border:none; border-radius:12px; background:#BE9EF4; color:#fff; font-size:15px; font-weight:700; box-shadow:0 4px 12px rgba(124,58,237,0.24);" style-hover="background:#AD8AEF;">Ir a iniciar sesión <i data-lucide="arrow-right" style="width:18px; height:18px;"></i></a>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:720}}">
class Component extends DCLogic {
  state = { step: 1, email: "", otp: ["","","","","",""], pw: "", pw2: "", showPw: false, showPw2: false,
            emailError: "", otpError: "", pwError: "" };

  renderVals() {
    const s = this.state;
    const meta = {
      1: { icon: "mail", title: "Recupera tu contraseña", subtitle: "Ingresa el email de tu cuenta y te enviaremos un código de verificación." },
      2: { icon: "shield-check", title: "Verifica el código", subtitle: "Escribe el código de 6 dígitos que enviamos a tu correo." },
      3: { icon: "key-round", title: "Nueva contraseña", subtitle: "Crea una contraseña de al menos 8 caracteres." },
      4: { icon: "check", title: "", subtitle: "" }
    }[s.step];
    const dots = [1,2,3].map(i => ({
      w: i === s.step ? "34px" : "8px",
      bg: i < s.step || s.step === 4 ? "#9B77E6" : (i === s.step ? "#BE9EF4" : "#E3DBF7")
    }));
    const otpCells = s.otp.map((v, i) => ({
      i, v,
      border: v ? "#BE9EF4" : "#E3DBF7",
      onInput: (e) => this.onOtp(i, e.target.value),
      onKey: (e) => this.onOtpKey(i, e)
    }));
    return {
      stepNum: Math.min(s.step, 3),
      icon: meta.icon, title: meta.title, subtitle: meta.subtitle,
      dots,
      isStep1: s.step === 1, isStep2: s.step === 2, isStep3: s.step === 3, isDone: s.step === 4,
      email: s.email, emailError: s.emailError,
      emailBorder: s.emailError ? "#F0A9A9" : "#E3DBF7",
      emailGap: s.emailError ? "8px" : "20px",
      otpCells, otpError: s.otpError,
      otpGap: s.otpError ? "8px" : "18px",
      pw: s.pw, pw2: s.pw2, pwError: s.pwError,
      reqs: [
        { label: "Al menos 8 caracteres", ok: s.pw.length >= 8 },
        { label: "Mayúscula y minúscula", ok: /[A-Z]/.test(s.pw) && /[a-z]/.test(s.pw) },
        { label: "Al menos un número", ok: /\d/.test(s.pw) },
        { label: "Un carácter especial (!@#$%…)", ok: /[^A-Za-z0-9]/.test(s.pw) }
      ].map(r => ({ label: r.label, met: r.ok, notMet: !r.ok })),
      pwBorder: s.pwError ? "#F0A9A9" : "#E3DBF7",
      pw2Border: s.pwError ? "#F0A9A9" : "#E3DBF7",
      pwGap: s.pwError ? "8px" : "20px",
      pwType: s.showPw ? "text" : "password",
      pwIcon: s.showPw ? "eye-off" : "eye",
      pw2Type: s.showPw2 ? "text" : "password",
      pw2Icon: s.showPw2 ? "eye-off" : "eye",
      togglePw: () => this.setState(st => ({ showPw: !st.showPw })),
      togglePw2: () => this.setState(st => ({ showPw2: !st.showPw2 })),
      onEmail: (e) => { const v = e.target.value; this.setState({ email: v, emailError: "" }); },
      onPw: (e) => { const v = e.target.value; this.setState({ pw: v, pwError: "" }); },
      onPw2: (e) => { const v = e.target.value; this.setState({ pw2: v, pwError: "" }); },
      noop: (e) => { e.preventDefault(); },
      back: () => {
        if (this.state.step > 1 && this.state.step < 4) this.setState(st => ({ step: st.step - 1 }));
        else window.location.href = "../sign-in/index.html";
      },
      next: () => this.advance()
    };
  }

  onOtp(i, val) {
    const digit = (val.match(/\d/g) || []).pop() || "";
    const otp = this.state.otp.slice();
    otp[i] = digit;
    this.setState({ otp, otpError: "" });
    if (digit && i < 5) {
      const el = document.querySelector('[data-otp="' + (i + 1) + '"]');
      if (el) el.focus();
    }
  }
  onOtpKey(i, e) {
    if (e.key === "Backspace" && !this.state.otp[i] && i > 0) {
      const el = document.querySelector('[data-otp="' + (i - 1) + '"]');
      if (el) el.focus();
    }
  }

  advance() {
    const s = this.state;
    if (s.step === 1) {
      const email = s.email.trim().toLowerCase();
      let emailError = "";
      if (!email) emailError = "El email es obligatorio.";
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) emailError = "Ingresa un email válido.";
      if (emailError) return this.setState({ emailError });
      this.setState({ step: 2 });
    } else if (s.step === 2) {
      const code = s.otp.join("");
      if (code.length < 6) return this.setState({ otpError: "Ingresa los 6 dígitos del código." });
      this.setState({ step: 3 });
    } else if (s.step === 3) {
      let pwError = "";
      if (!s.pw || !s.pw2) pwError = "Completa ambos campos.";
      else if (!(s.pw.length >= 8 && /[A-Z]/.test(s.pw) && /[a-z]/.test(s.pw) && /\d/.test(s.pw) && /[^A-Za-z0-9]/.test(s.pw))) pwError = "La contraseña no cumple los requisitos.";
      else if (s.pw !== s.pw2) pwError = "Las contraseñas no coinciden.";
      if (pwError) return this.setState({ pwError });
      this.setState({ step: 4 });
    }
  }

  componentDidMount() { this._ensure(); }
  componentDidUpdate() { this._icons(); }
  _icons() {
    if (window.lucide) { cancelAnimationFrame(this._raf); this._raf = requestAnimationFrame(() => window.lucide.createIcons()); }
    else this._ensure();
  }
  _ensure() {
    if (window.lucide) return this._icons();
    let n = 0;
    clearInterval(this._t);
    this._t = setInterval(() => {
      if (window.lucide) { window.lucide.createIcons(); clearInterval(this._t); }
      else if (++n >= 40) clearInterval(this._t);
    }, 100);
  }
  componentWillUnmount() { clearInterval(this._t); cancelAnimationFrame(this._raf); }
}
</script>
</body>
</html>
