<noscript><div role="alert" style="padding:14px 20px; background:#7F1D1D; color:#fff; font:700 16px/1.45 system-ui,sans-serif; text-align:center;">Esta pantalla necesita JavaScript activado para mostrarse completa.</div></noscript>
<x-dc>
<helmet>
<link rel="stylesheet" href="../_shared/theme.css">
<script src="../_shared/theme-boot.js"></script>
<link rel="stylesheet" href="../_shared/fonts/nunito-sans.css">
<script src="../_shared/vendor/lucide.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #1F2937; background: #EDE7FB; -webkit-font-smoothing: antialiased; }
  a { color: #9B77E6; text-decoration: none; }
  ::selection { background: #EDE9FE; }
  .lucide { stroke-width: 2; }
  input::placeholder { color: #A6A0B4; }
</style>
</helmet>
<div style="width:100%; min-height:100vh; overflow-y:auto; background:linear-gradient(160deg,#F3EFFB 0%,#EDE7FB 100%); position:relative; display:flex; align-items:center; justify-content:center; padding:88px 40px 32px;">

  <a href="../sign-in/index.html" aria-label="Volver" style="position:absolute; top:26px; left:26px; z-index:10; width:48px; height:48px; border-radius:14px; background:#fff; border:1px solid #E7DEF8; display:flex; align-items:center; justify-content:center; color:#7E5AD0; box-shadow:0 4px 12px rgba(124,58,237,0.10);" style-hover="background:#F1EBFC;">
    <i data-lucide="arrow-left" style="width:22px; height:22px;"></i>
  </a>

  <div style="width:100%; max-width:480px;">
    <div style="background:#fff; border-radius:26px; padding:38px 36px; box-shadow:0 20px 46px rgba(30,20,60,0.12);">
      <div style="width:66px; height:66px; margin:0 auto 18px; border-radius:20px; background:#EFEBFD; display:flex; align-items:center; justify-content:center;"><i data-lucide="user-plus" style="width:32px; height:32px; color:#9B77E6;"></i></div>
      <h1 style="font-size:26px; font-weight:800; color:#1F2937; text-align:center; margin:0 0 6px; letter-spacing:-0.4px;">Crear cuenta</h1>
      <p style="font-size:14px; color:#9CA3AF; text-align:center; margin:0 0 26px; font-weight:600;">Únete y empieza a comunicarte sin barreras</p>

      <label style="display:block; font-size:13px; font-weight:800; color:#4B5563; margin-bottom:8px;">Nombre</label>
      <div style="display:flex; align-items:center; gap:10px; background:#FBFAFE; border:1.5px solid {{ nameBorder }}; border-radius:12px; height:52px; padding:0 16px; margin-bottom:{{ nameGap }};">
        <i data-lucide="user" style="width:19px; height:19px; color:#9B77E6;"></i>
        <input value="{{ name }}" onInput="{{ onName }}" placeholder="Tu nombre" style="flex:1; border:none; background:transparent; outline:none; font-family:inherit; font-size:15px; color:#1F2937;">
      </div>
      <sc-if value="{{ nameError }}" hint-placeholder-val="">
        <div style="display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:#EF4444; margin-bottom:14px;"><i data-lucide="alert-circle" style="width:14px; height:14px;"></i>{{ nameError }}</div>
      </sc-if>

      <label style="display:block; font-size:13px; font-weight:800; color:#4B5563; margin-bottom:8px;">Email</label>
      <div style="display:flex; align-items:center; gap:10px; background:#FBFAFE; border:1.5px solid {{ emailBorder }}; border-radius:12px; height:52px; padding:0 16px; margin-bottom:{{ emailGap }};">
        <i data-lucide="mail" style="width:19px; height:19px; color:#9B77E6;"></i>
        <input type="email" value="{{ email }}" onInput="{{ onEmail }}" placeholder="tucorreo@ejemplo.com" style="flex:1; border:none; background:transparent; outline:none; font-family:inherit; font-size:15px; color:#1F2937;">
      </div>
      <sc-if value="{{ emailError }}" hint-placeholder-val="">
        <div style="display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:#EF4444; margin-bottom:14px;"><i data-lucide="alert-circle" style="width:14px; height:14px;"></i>{{ emailError }}</div>
      </sc-if>

      <label style="display:block; font-size:13px; font-weight:800; color:#4B5563; margin-bottom:8px;">Contraseña</label>
      <div style="display:flex; align-items:center; gap:10px; background:#FBFAFE; border:1.5px solid {{ pwBorder }}; border-radius:12px; height:52px; padding:0 16px; margin-bottom:12px;">
        <i data-lucide="lock" style="width:19px; height:19px; color:#9B77E6;"></i>
        <input type="{{ pwType }}" value="{{ password }}" onInput="{{ onPassword }}" placeholder="Mínimo 8 caracteres" style="flex:1; border:none; background:transparent; outline:none; font-family:inherit; font-size:15px; color:#1F2937;">
        <span onClick="{{ togglePw }}" style="display:flex; cursor:pointer;"><i data-lucide="{{ pwIcon }}" style="width:19px; height:19px; color:#A6A0B4;"></i></span>
      </div>

      <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
        <div style="flex:1; display:flex; gap:5px;">
          <sc-for list="{{ strength }}" as="c" hint-placeholder-count="4">
            <span style="flex:1; height:6px; border-radius:999px; background:{{ c }};"></span>
          </sc-for>
        </div>
        <span style="font-size:12px; font-weight:800; color:{{ strengthColor }};">{{ strengthLabel }}</span>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:{{ pwGap }};">
        <sc-for list="{{ reqs }}" as="r" hint-placeholder-count="4">
          <div style="display:flex; align-items:center; gap:9px;">
            <sc-if value="{{ r.met }}" hint-placeholder-val=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><path d="m9 11 3 3L22 4"></path></svg></sc-if>
            <sc-if value="{{ r.notMet }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C4B5FD" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg></sc-if>
            <span style="font-size:13px; font-weight:600; color:#6B7280;">{{ r.label }}</span>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{ pwError }}" hint-placeholder-val="">
        <div style="display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:#EF4444; margin-bottom:14px;"><i data-lucide="alert-circle" style="width:14px; height:14px;"></i>{{ pwError }}</div>
      </sc-if>

      <label style="display:flex; align-items:flex-start; gap:11px; margin-bottom:{{ termsGap }}; cursor:pointer;">
        <sc-if value="{{ terms }}" hint-placeholder-val=""><span onClick="{{ toggleTerms }}" style="width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,#BE9EF4,#D4C2F3); border:1.5px solid #BE9EF4; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;"><i data-lucide="check" style="width:15px; height:15px; color:#fff;"></i></span></sc-if>
        <sc-if value="{{ notTerms }}" hint-placeholder-val="{{ true }}"><span onClick="{{ toggleTerms }}" style="width:22px; height:22px; border-radius:6px; background:#fff; border:1.5px solid #D6C9F5; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;"></span></sc-if>
        <span style="font-size:13px; line-height:1.5; color:#6B7280;">Acepto los <a href="../view-terms/index.html" style="font-weight:700;">Términos y Condiciones</a> y la <a href="../view-privacy-policy/index.html" style="font-weight:700;">Política de Privacidad</a>.</span>
      </label>
      <sc-if value="{{ termsError }}" hint-placeholder-val="">
        <div style="display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:#EF4444; margin-bottom:16px;"><i data-lucide="alert-circle" style="width:14px; height:14px;"></i>{{ termsError }}</div>
      </sc-if>

      <button onClick="{{ submit }}" style="width:100%; display:flex; align-items:center; justify-content:center; gap:9px; height:54px; border:none; border-radius:12px; background:linear-gradient(135deg,#BE9EF4,#D4C2F3); color:#fff; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(124,58,237,0.24); margin-bottom:20px;" style-hover="background:#AD8AEF;">Registrarse</button>

      <p style="font-size:14px; color:#6B7280; text-align:center; margin:0; font-weight:600;">¿Ya tienes cuenta? <a href="../sign-in/index.html" style="font-weight:800;">Inicia sesión</a></p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { name: "", email: "", password: "", showPw: false, terms: false,
            nameError: "", emailError: "", pwError: "", termsError: "", touched: false };

  pwScore(pw) {
    let s = 0;
    if (pw.length >= 8) s++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) s++;
    if (/\d/.test(pw)) s++;
    if (/[^A-Za-z0-9]/.test(pw)) s++;
    return s;
  }

  validate() {
    const name = this.state.name.trim();
    const email = this.state.email.trim().toLowerCase();
    const pw = this.state.password;
    let nameError = "", emailError = "", pwError = "", termsError = "";
    if (!name) nameError = "El nombre es obligatorio.";
    if (!email) emailError = "El email es obligatorio.";
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) emailError = "Ingresa un email válido.";
    if (!pw) pwError = "La contraseña es obligatoria.";
    else if (!(pw.length >= 8 && /[A-Z]/.test(pw) && /[a-z]/.test(pw) && /\d/.test(pw) && /[^A-Za-z0-9]/.test(pw))) pwError = "La contraseña no cumple los requisitos.";
    if (!this.state.terms) termsError = "Debes aceptar los términos para continuar.";
    return { nameError, emailError, pwError, termsError };
  }

  renderVals() {
    const s = this.state;
    const t = s.touched;
    const nErr = t ? s.nameError : "", eErr = t ? s.emailError : "", pErr = t ? s.pwError : "", tErr = t ? s.termsError : "";
    const score = this.pwScore(s.password);
    const bars = ["#E3DBF7", "#E3DBF7", "#E3DBF7", "#E3DBF7"];
    const meta = [
      { c: "#E3DBF7", label: "", color: "#9CA3AF" },
      { c: "#EF4444", label: "Débil", color: "#EF4444" },
      { c: "#F59E0B", label: "Regular", color: "#F59E0B" },
      { c: "#F59E0B", label: "Buena", color: "#F59E0B" },
      { c: "#10B981", label: "Fuerte", color: "#10B981" }
    ][score];
    for (let i = 0; i < score; i++) bars[i] = meta.c;
    const pw = s.password;
    const reqDefs = [
      { label: "Al menos 8 caracteres", ok: pw.length >= 8 },
      { label: "Mayúscula y minúscula", ok: /[A-Z]/.test(pw) && /[a-z]/.test(pw) },
      { label: "Al menos un número", ok: /\d/.test(pw) },
      { label: "Un carácter especial (!@#$…)", ok: /[^A-Za-z0-9]/.test(pw) }
    ];
    return {
      name: s.name, email: s.email, password: s.password,
      nameError: nErr, emailError: eErr, pwError: pErr, termsError: tErr,
      nameBorder: nErr ? "#F0A9A9" : "#E3DBF7",
      emailBorder: eErr ? "#F0A9A9" : "#E3DBF7",
      pwBorder: pErr ? "#F0A9A9" : "#E3DBF7",
      nameGap: nErr ? "8px" : "16px",
      emailGap: eErr ? "8px" : "16px",
      pwGap: pErr ? "8px" : "22px",
      termsGap: tErr ? "8px" : "24px",
      pwType: s.showPw ? "text" : "password",
      pwIcon: s.showPw ? "eye-off" : "eye",
      strength: bars,
      strengthLabel: s.password ? meta.label : "",
      strengthColor: meta.color,
      reqs: reqDefs.map(r => ({ label: r.label, met: r.ok, notMet: !r.ok })),
      terms: s.terms, notTerms: !s.terms,
      togglePw: () => this.setState(st => ({ showPw: !st.showPw })),
      toggleTerms: () => this.setState(st => ({ terms: !st.terms, termsError: "" })),
      onName: (e) => { const v = e.target.value; this.setState({ name: v, nameError: "" }); },
      onEmail: (e) => { const v = e.target.value; this.setState({ email: v, emailError: "" }); },
      onPassword: (e) => { const v = e.target.value; this.setState({ password: v, pwError: "" }); },
      submit: () => {
        const errs = this.validate();
        this.setState({ ...errs, touched: true });
        if (!errs.nameError && !errs.emailError && !errs.pwError && !errs.termsError) { const em = this.state.email; window.__tsSignIn(em); window.location.href = window.__tsHomeFor(em); }
      }
    };
  }
  componentDidMount() { this._ensure(); }
  componentDidUpdate() { this._icons(); }
  _icons() {
    if (window.lucide) { cancelAnimationFrame(this._raf); this._raf = requestAnimationFrame(() => window.lucide.createIcons()); }
    else this._ensure();
  }
  _ensure() {
    let n = 0;
    clearInterval(this._t);
    this._t = setInterval(() => {
      if (window.lucide) window.lucide.createIcons();
      const left = document.querySelectorAll('i[data-lucide]').length;
      if (left === 0 || ++n >= 120) clearInterval(this._t);
    }, 100);
  }
  componentWillUnmount() { clearInterval(this._t); cancelAnimationFrame(this._raf); }
}
</script>
</body>
</html>
