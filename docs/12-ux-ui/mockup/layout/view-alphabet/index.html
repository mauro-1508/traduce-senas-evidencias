<x-dc>
<helmet>
<link rel="stylesheet" href="../_shared/fonts/nunito-sans.css">

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #1F2937; background: #FFFFFF; -webkit-font-smoothing: antialiased; }
  a { color: #9B77E6; text-decoration: none; }
  ::selection { background: #EDE9FE; }
  .lucide { stroke-width: 2; }
</style>
</helmet>
<div style="width:100%; background:#FFFFFF;">
  <dc-import name="SiteHeader" mode="app" active="alfabeto" hint-size="100%,78px"></dc-import>

  <section style="background:linear-gradient(160deg,#FBFAFE 0%,#F6F3FD 100%);">
    <div style="max-width:1200px; margin:0 auto; padding:52px 40px 30px; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap;">
      <div>
        <div style="display:inline-flex; align-items:center; gap:9px; background:#EFEBFD; border-radius:999px; padding:8px 16px 8px 13px; margin-bottom:16px;">
          <i data-lucide="hand" style="width:15px; height:15px; color:#9B77E6;"></i>
          <span style="font-size:13px; font-weight:700; color:#7E5AD0;">Lengua de Señas Colombiana</span>
        </div>
        <h1 style="font-size:44px; line-height:1.1; font-weight:800; letter-spacing:-0.6px; margin:0 0 12px; color:#1F2937;">Alfabeto <span style="color:#9B77E6;">LSC</span></h1>
        <p style="font-size:17px; line-height:1.6; color:#6B7280; margin:0; max-width:520px;">Explora cada letra dactilológica. Toca una tarjeta para ver la configuración de la mano y practicar la seña.</p>
      </div>
      <div style="display:inline-flex; align-items:center; gap:9px; background:#fff; border:1px solid #E3DBF7; border-radius:999px; padding:9px 18px; box-shadow:0 4px 12px rgba(124,58,237,0.08);">
        <i data-lucide="grid-3x3" style="width:16px; height:16px; color:#9B77E6;"></i>
        <span style="font-size:14px; font-weight:800; color:#7E5AD0;">26 letras</span>
      </div>
    </div>
  </section>

  <section style="background:#fff;">
    <div style="max-width:1200px; margin:0 auto; padding:34px 40px 64px;">
      <div style="display:grid; grid-template-columns:repeat(9,1fr); gap:18px;">
        <sc-for list="{{ letters }}" as="L" hint-placeholder-count="26">
          <button onClick="{{ L.open }}" style="position:relative; border:none; cursor:pointer; padding:0; aspect-ratio:1/1; border-radius:22px; background:{{ L.bg }}; display:flex; align-items:center; justify-content:center; transition:transform .18s, box-shadow .18s;" style-hover="transform:translateY(-4px); box-shadow:0 14px 26px rgba(30,20,60,0.12);">
            <i data-lucide="hand" style="width:44px; height:44px; color:{{ L.faint }};"></i>
            <span style="position:absolute; left:12px; bottom:12px; min-width:30px; height:30px; padding:0 8px; border-radius:999px; background:{{ L.badge }}; color:#fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(0,0,0,0.12);">{{ L.ch }}</span>
          </button>
        </sc-for>
      </div>

    </div>
  </section>

  <sc-if value="{{ isOpen }}" hint-placeholder-val="">
    <div onClick="{{ close }}" style="position:fixed; inset:0; z-index:60; background:rgba(30,20,50,0.55); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:32px; overflow-y:auto;">
      <div onClick="{{ stop }}" class="ts-keep" style="width:100%; max-width:480px; margin:auto; background:#fff; border-radius:24px; overflow:hidden; box-shadow:0 30px 70px rgba(30,20,60,0.35);">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid #F1EEF9;">
          <div style="display:flex; align-items:center; gap:14px;">
            <div style="width:52px; height:52px; border-radius:14px; background:{{ sel.bg }}; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:900; color:{{ sel.badge }};">{{ sel.ch }}</div>
            <div>
              <div style="font-size:18px; font-weight:800; color:#1F2937; line-height:1.1;">Letra {{ sel.ch }}</div>
              <div style="font-size:13px; font-weight:700; color:#9CA3AF; margin-top:2px;">{{ sel.pos }} de 26 · LSC</div>
            </div>
          </div>
          <button onClick="{{ close }}" aria-label="Cerrar" style="width:40px; height:40px; border:none; border-radius:11px; background:#F3F0FB; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#6B7280;" style-hover="background:#EDE9FE; color:#7C3AED;"><i data-lucide="x" style="width:20px; height:20px;"></i></button>
        </div>
        <div style="padding:22px;">
          <div style="position:relative; border-radius:16px; overflow:hidden; background:linear-gradient(160deg,#2A2140,#3A2E5C); aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; margin-bottom:16px;">
            <i data-lucide="hand" style="width:110px; height:110px; color:rgba(255,255,255,0.28);"></i>
            <div style="position:absolute; top:14px; left:14px; display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,0.16); backdrop-filter:blur(6px); border-radius:999px; padding:6px 12px;"><i data-lucide="video" style="width:14px; height:14px; color:#fff;"></i><span style="font-size:12px; font-weight:700; color:#fff;">Video de la seña</span></div>
          </div>
          <div style="display:flex; gap:12px; margin-bottom:16px;">
            <button style="flex:1; display:flex; align-items:center; justify-content:center; gap:9px; height:48px; border:none; border-radius:12px; background:linear-gradient(135deg,#BE9EF4,#D4C2F3); color:#fff; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(124,58,237,0.24);" style-hover="background:#AD8AEF;"><i data-lucide="play" style="width:18px; height:18px; fill:#fff;"></i>Reproducir</button>
            <button style="width:48px; height:48px; border:1.5px solid #D6C9F5; border-radius:12px; background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#9B77E6;" style-hover="background:#F4F1FC;"><i data-lucide="rotate-ccw" style="width:19px; height:19px;"></i></button>
          </div>
          <div style="display:flex; gap:12px; align-items:flex-start; background:#FBFAFE; border:1px solid #F1EEF9; border-radius:14px; padding:15px 16px; margin-bottom:18px;">
            <span style="width:34px; height:34px; flex-shrink:0; border-radius:10px; background:#EDE9FE; display:flex; align-items:center; justify-content:center;"><i data-lucide="lightbulb" style="width:17px; height:17px; color:#9B77E6;"></i></span>
            <div><div style="font-size:14px; font-weight:800; color:#1F2937; margin-bottom:3px;">Consejo</div><div style="font-size:14px; line-height:1.5; color:#6B7280;">{{ sel.tip }}</div></div>
          </div>
          <div style="display:flex; gap:12px;">
            <button onClick="{{ prev }}" style="flex:1; display:flex; align-items:center; justify-content:center; gap:8px; height:46px; border:1.5px solid #EEE9FA; border-radius:12px; background:#fff; color:#4B5563; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;" style-hover="background:#F9F7FD;"><i data-lucide="chevron-left" style="width:18px; height:18px;"></i>Anterior</button>
            <button onClick="{{ next }}" style="flex:1; display:flex; align-items:center; justify-content:center; gap:8px; height:46px; border:1.5px solid #EEE9FA; border-radius:12px; background:#fff; color:#4B5563; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;" style-hover="background:#F9F7FD;">Siguiente<i data-lucide="chevron-right" style="width:18px; height:18px;"></i></button>
          </div>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { open: -1, dark: false };
  renderVals() {
    let dark = false;
    try { const p = JSON.parse(localStorage.getItem("ts-prefs") || "{}"); dark = !!p.dark; } catch (e) {}
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const palette = dark ? [
      { bg: "rgba(139,92,246,0.16)", badge: "#8B5CF6", faint: "rgba(201,186,243,0.35)" },
      { bg: "rgba(59,130,246,0.16)", badge: "#3B82F6", faint: "rgba(174,203,246,0.35)" },
      { bg: "rgba(16,185,129,0.16)", badge: "#10B981", faint: "rgba(166,229,204,0.35)" },
      { bg: "rgba(245,158,11,0.16)", badge: "#F59E0B", faint: "rgba(235,208,138,0.35)" },
      { bg: "rgba(236,72,153,0.16)", badge: "#EC4899", faint: "rgba(243,181,206,0.35)" },
      { bg: "rgba(239,68,68,0.16)", badge: "#EF4444", faint: "rgba(243,176,176,0.35)" }
    ] : [
      { bg: "#EFEBFD", badge: "#8B5CF6", faint: "#C9BAF3" },
      { bg: "#E4EEFE", badge: "#3B82F6", faint: "#AECBF6" },
      { bg: "#DCF5EA", badge: "#10B981", faint: "#A6E5CC" },
      { bg: "#FCF3D6", badge: "#F59E0B", faint: "#EBD08A" },
      { bg: "#FCE3EC", badge: "#EC4899", faint: "#F3B5CE" },
      { bg: "#FDE4E4", badge: "#EF4444", faint: "#F3B0B0" }
    ];
    const tip = (ch) => "Mantén la mano a la altura del pecho y marca bien la forma de la letra “" + ch + "”.";
    const letters = chars.map((ch, i) => {
      const p = palette[i % palette.length];
      return { ch, bg: p.bg, badge: p.badge, faint: p.faint, open: () => this.setState({ open: i }) };
    });
    const n = this.state.open;
    const selBase = n >= 0 ? palette[n % palette.length] : palette[0];
    const sel = { ch: n >= 0 ? chars[n] : "", bg: selBase.bg, badge: selBase.badge, tip: n >= 0 ? tip(chars[n]) : "", pos: n >= 0 ? n + 1 : "" };
    return {
      letters,
      isOpen: n >= 0,
      sel,
      close: () => this.setState({ open: -1 }),
      stop: (e) => e.stopPropagation(),
      prev: () => this.setState(s => ({ open: (s.open - 1 + chars.length) % chars.length })),
      next: () => this.setState(s => ({ open: (s.open + 1) % chars.length }))
    };
  }
  componentDidMount() { this._sync = () => this.forceUpdate(); window.addEventListener("ts-prefs-change", this._sync); this._ensure(); }
  componentDidUpdate() { this._icons(); }
  _icons() {
    if (window.lucide) { cancelAnimationFrame(this._raf); this._raf = requestAnimationFrame(() => window.lucide.createIcons()); }
    else this._ensure();
  }
  _ensure() {
    let n = 0;
    clearInterval(this._t);
    this._t = setInterval(() => {
      if (window.lucide) window.lucide.createIcons();
      const left = document.querySelectorAll('i[data-lucide]').length;
      if (left === 0 || ++n >= 120) clearInterval(this._t);
    }, 100);
  }
  componentWillUnmount() { clearInterval(this._t); cancelAnimationFrame(this._raf); window.removeEventListener("ts-prefs-change", this._sync); }
}
</script>
</body>
